# gitleaks configuration (scripts/audit.sh runs `gitleaks dir .` and
# `gitleaks git .`).
#
# Extend the default rule set; only add allowlists, never remove rules.
[extend]
useDefault = true

# Local, never-committed material. `gitleaks dir` scans the whole working tree,
# including gitignored files, so the generated Talos PKI (bootstrap/vm/
# controlplane.yaml, talosconfig), the agent workspace (.kilo/) and the
# Playwright session state would otherwise fail the sweep. This file is for the
# WORKING-TREE scan only; history uses .gitleaks-history.toml, which does NOT
# allowlist bootstrap/vm/ (a force-added talosconfig must fail the history
# scan).
[[allowlists]]
description = "generated/local state that is never committed"
paths = [
  '''^bootstrap/vm/''',
  '''^\.kilo/''',
  '''^ui/\.env''',
  '''^ui/tests/\.auth/''',
  # Generated build output (present locally, absent from a fresh CI checkout).
  '''^rust/target/''',
  '''^ui/node_modules/''',
  '''^ui/\.svelte-kit/''',
  '''^ui/dist/''',
  '''^ui/test-results/''',
  '''^ui/playwright-report/''',
]

# Intentional test fixtures that look like secrets.
[[allowlists]]
description = "test fixtures"
paths = [
  '''^ui/tests/totp\.spec\.ts$''',
]

# FR-UPD prose tripped the generic-api-key heuristic ("API image digest,
# Talos/Kubernetes"). It is documentation, not a credential; the earlier commit
# is already in this branch's history.
[[allowlists]]
description = "FR-UPD spec prose (false positive)"
regexTarget = "match"
regexes = ['''API image digest, Talos/Kubernetes''']
