apiVersion: batch/v1
kind: CronJob
metadata:
  name: naslos-openldap-backup
  namespace: naslos
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: naslos-openldap-backup
          containers:
            - name: backup
              image: 192.168.1.2:30095/naslos-openldap:0.1.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  BACKUP_DIR="/var/lib/ldap/backups"
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)

                  # Backup config
                  slapcat -n 0 -l "${BACKUP_DIR}/config_${TIMESTAMP}.ldif"

                  # Backup data
                  slapcat -n 1 -l "${BACKUP_DIR}/data_${TIMESTAMP}.ldif"

                  # Keep only last 7 backups
                  ls -t ${BACKUP_DIR}/config_*.ldif 2>/dev/null | tail -n +8 | xargs rm -f
                  ls -t ${BACKUP_DIR}/data_*.ldif 2>/dev/null | tail -n +8 | xargs rm -f

                  echo "Backup completed: ${TIMESTAMP}"
              volumeMounts:
                - name: data
                  mountPath: /var/lib/ldap
                  readOnly: true
                - name: backup
                  mountPath: /var/lib/ldap/backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-naslos-openldap-0
            - name: backup
              persistentVolumeClaim:
                claimName: config-naslos-openldap-0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-openldap-backup
  namespace: naslos
