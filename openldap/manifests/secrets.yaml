# OpenLDAP secrets - GENERATE REAL VALUES FOR PRODUCTION
# Use: kubectl create secret generic nasos-openldap --from-literal=admin-password='...' --from-literal=service-password='...' -n nasos
#
# The TLS secret should contain the CA certificate for LDAPS verification:
# kubectl create secret generic nasos-openldap-tls --from-file=ca.crt=./ca.crt -n nasos

apiVersion: v1
kind: Secret
metadata:
  name: nasos-openldap
  namespace: nasos
type: Opaque
stringData:
  admin-password: "CHANGE_ME_ADMIN_PASSWORD"
  service-password: "CHANGE_ME_SERVICE_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: nasos-openldap-tls
  namespace: nasos
type: Opaque
data:
  ca.crt: LS0tLS1CRUdJTi... # base64-encoded CA certificate
