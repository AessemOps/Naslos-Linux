apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: naslos-openldap
  namespace: naslos
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
spec:
  serviceName: naslos-openldap
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-openldap
    spec:
      # fsGroup must match the openldap user's GID (101 in the Debian
      # image), not an arbitrary value — otherwise the group-owned
      # /container/service/slapd/assets/certs (mounted from a Secret
      # with defaultMode 0440 below) stays unreadable by openldap and
      # slapd fails at startup with "TLS: could not use CA certificate
      # file ...: Error while reading file".
      securityContext:
        fsGroup: 101
      containers:
        - name: openldap
          image: 192.168.1.2:30095/naslos-openldap:0.1.0-r4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 636
              name: ldaps
          env:
            - name: LDAP_DOMAIN
              value: "naslos.local"
            - name: LDAP_ORGANISATION
              value: "Naslos"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: admin-password
            - name: LDAP_TLS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldap
            - name: config
              mountPath: /etc/ldap/slapd.d
            - name: certs
              mountPath: /container/service/slapd/assets/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # 512Mi was too tight for first-boot initialization (RSA-4096
              # TLS cert generation + full schema/module/database slapadd
              # bootstrap) and caused the container to be OOMKilled before
              # slapd ever finished starting.
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: certs
          secret:
            secretName: naslos-openldap-tls
            # 0440 (not 0400): the file must be group-readable so the
            # fsGroup-owned group (101 = openldap, set above) can read it
            # once slapd drops root privileges to the openldap user.
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-openldap
  namespace: naslos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: naslos-openldap
  ports:
    - port: 636
      targetPort: 636
      name: ldaps
