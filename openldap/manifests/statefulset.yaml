apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nasos-openldap
  namespace: nasos
  labels:
    app.kubernetes.io/name: nasos-openldap
    app.kubernetes.io/component: identity
spec:
  serviceName: nasos-openldap
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nasos-openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nasos-openldap
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: openldap
          image: ghcr.io/nasos/nasos-openldap:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 636
              name: ldaps
          env:
            - name: LDAP_DOMAIN
              value: "nasos.local"
            - name: LDAP_ORGANISATION
              value: "NasOS"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nasos-openldap
                  key: admin-password
            - name: LDAP_TLS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldap
            - name: config
              mountPath: /etc/ldap/slapd.d
            - name: certs
              mountPath: /container/service/slapd/assets/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: certs
          secret:
            secretName: nasos-openldap-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nasos-zfs
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nasos-zfs
        resources:
          requests:
            storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nasos-openldap
  namespace: nasos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nasos-openldap
  ports:
    - port: 636
      targetPort: 636
      name: ldaps
