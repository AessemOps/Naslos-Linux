apiVersion: batch/v1
kind: Job
metadata:
  name: nasos-openldap-bootstrap
  namespace: nasos
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: nasos-openldap-bootstrap
      initContainers:
        # Wait for OpenLDAP to be ready
        - name: wait-for-ldap
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z nasos-openldap 636; do
                echo "Waiting for OpenLDAP..."
                sleep 2
              done
              echo "OpenLDAP is ready"
      containers:
        - name: bootstrap
          image: ghcr.io/nasos/nasos-openldap:0.1.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Configuring OpenLDAP..."

              # Update service account password
              SERVICE_PW=$(cat /run/secrets/service-password)
              SERVICE_PW_HASH=$(slappasswd -h "{SSHA}" -s "$SERVICE_PW")

              cat > /tmp/update-service-pw.ldif <<EOF
              dn: cn=nasos-service,ou=services,dc=nasos,dc=local
              changetype: modify
              replace: userPassword
              userPassword: $SERVICE_PW_HASH
              EOF

              ldapmodify -x -H ldapi:/// -D "cn=admin,dc=nasos,dc=local" -w "$(cat /run/secrets/admin-password)" -f /tmp/update-service-pw.ldif

              # Verify groups exist (created by bootstrap.ldif)
              echo "Verifying groups..."
              ldapsearch -x -H ldapi:/// -D "cn=admin,dc=nasos,dc=local" -w "$(cat /run/secrets/admin-password)" \
                -b "cn=nasos_admins,ou=groups,dc=nasos,dc=local" -s base "(objectClass=*)" cn

              echo "OpenLDAP bootstrap completed successfully!"
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: nasos-openldap
            items:
              - key: admin-password
                path: admin-password
              - key: service-password
                path: service-password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nasos-openldap-bootstrap
  namespace: nasos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nasos-openldap-bootstrap
  namespace: nasos
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nasos-openldap-bootstrap
  namespace: nasos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nasos-openldap-bootstrap
subjects:
  - kind: ServiceAccount
    name: nasos-openldap-bootstrap
    namespace: nasos
