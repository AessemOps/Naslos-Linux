# NasOS single-node VM machine-config patch
# Target: 192.168.1.96
#
# This patch is applied on top of the Talos controlplane config generated by
# `talosctl gen config`. It pins the installer to the NasOS Image Factory
# schematic (ZFS extension) and sets the VM-specific network / cluster options.

machine:
  install:
    # NasOS installer with the siderolabs/zfs system extension
    image: factory.talos.dev/installer/4dd8e3a8b6203d3c14f049da8db4d3bb0d6d3e70c5e89dfcc1e709e81914f63c:v1.14.0
    disk: /dev/vda
    wipe: true
  network:
    hostname: nasos-vm
    interfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 192.168.1.96
  # Allow workloads (including NasOS UI/API/agent) on the single control-plane node
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: "false"

cluster:
  # Single-node control plane; API server endpoint is the VM IP.
  controlPlane:
    endpoint: https://192.168.1.96:6443
  allowSchedulingOnControlPlanes: true
  proxy:
    disabled: false
  discovery:
    enabled: true
