# Naslos single-node VM machine-config patch
# Target: 192.168.1.96
#
# This patch is applied on top of the Talos controlplane config generated by
# `talosctl gen config`. It sets the VM-specific network options and the
# private HTTP container registry used by this deployment.
# NOTE: for Talos v1.14 install is driven by the legacy machine.install block
# below (still supported). The newer UnattendedInstallConfig document is
# intentionally NOT used — its CEL diskSelector never matched on this VM.
# Hostname is intentionally NOT set here: the generated base config already
# contains a HostnameConfig document (auto: stable), and Talos rejects a
# patch that sets a static hostname alongside it. The node keeps its stable
# auto hostname; the VIP 192.168.1.96 is what matters for access.

machine:
  # ZFS kernel module: REQUIRED for the siderolabs/zfs extension to work.
  # The extension ships the module binaries + userspace + ext-zfs-service,
  # but Talos never modprobes it on its own — without this block there is no
  # /dev/zfs, ext-zfs-service waits forever ("Waiting for file /dev/zfs to
  # exist"), and naslos-agent runs degraded. Verified via maintenance-boot
  # probe on 2026-09-11 (extension present, module absent, service Waiting).
  kernel:
    modules:
      - name: zfs
  network:
    interfaces:
      - interface: eth0
        dhcp: true
        # NOTE: no `vip:` here. A single-node cluster does not need a VIP —
        # and setting vip == DHCP-assigned address (192.168.1.96) breaks the
        # VIP controller and leaves Talos unable to pick a node address, so
        # kubelet is never launched (cri up but `containers --namespace cri`
        # empty, `service kubelet not registered`, NodeApplyController
        # timeouts). Keep .96 stable with a DHCP reservation instead.
  # NOTE: the legacy machine.install block below is still supported in v1.14
  # and installs reliably to /dev/vda (this VM's disk, virtio-blk),
  # so we use it instead of the UnattendedInstall
  # document for the Naslos/stock installer image selection.
  install:
    # Talos v1.14 installer via Image Factory with the siderolabs/zfs
    # extension (schematic 4dd8e3a8b6203d3c14f049da8db4d3bb0d6d3e70c5e89dfcc1e709e81914f63c,
    # confirmed bootable with zfs 2.4.4-v1.14.0 on kernel 6.18.48 on
    # 2026-09-11). The boot ISO (metal-amd64.iso for the same schematic) is
    # attached as the VM cdrom for (re)installs.
    image: factory.talos.dev/installer/4dd8e3a8b6203d3c14f049da8db4d3bb0d6d3e70c5e89dfcc1e709e81914f63c:v1.14.0
    disk: /dev/vda
    wipe: true
  registries:
    mirrors:
      "192.168.1.2:30095":
        endpoints:
          - "http://192.168.1.2:30095"
    config:
      "192.168.1.2:30095":
        auth:
          username: "_"
          password: "secret"

---
# Talos v1.14 `gen config` auto-generates a stock UnattendedInstallConfig doc
# for /dev/sda. It is still stripped (see `bootstrap-vm` target) so our
# machine.install above — ZFS installer
# 4dd8e3a8b6203d3c14f049da8db4d3bb0d6d3e70c5e89dfcc1e709e81914f63c,
# /dev/vda, wipe:true — stays authoritative.
# Talos v1.14: install is driven by machine.install above; the
# UnattendedInstallConfig document form is intentionally omitted.
# Disk is /dev/vda on this VM (virtio-blk).

---
# Kubelet nodeIP: with plain DHCP (no VIP, see above), let Talos pick a valid
# node address instead of the empty default.
# "no suitable node IP found, please make sure .machine.kubelet.nodeIP
# filters and pod/service subnets are set up correctly".
# taints: {} — single-node cluster: do NOT NoSchedule the control-plane node.
# By default Talos v1.14 applies node-role.kubernetes.io/control-plane:NoSchedule
# via KubeNodeConfig, leaving every workload (api/ui/agent, traefik, authelia,
# prometheus, grafana, openldap) Pending with no schurable node. Clearing the
# taints map is the correct single-node VM configuration.
# NOTE: `taints: {}` alone does NOT clear the map under JSON merge patch —
# an empty map is ignored. Use `$patch: delete` on the taints key instead,
# which RFC 7386 understands as "remove this key".
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
taints:
  $patch: delete
