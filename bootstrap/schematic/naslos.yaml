# Naslos Image Factory Schematic
# This schematic extends stock Talos Linux with the ZFS extension.
# It is applied to any Talos version via the Image Factory to produce
# a Naslos boot image. No base Talos modification is needed.
#
# Usage:
#   talosctl image factory schematic render --schematic bootstrap/schematic/naslos.yaml
#   talosctl image factory schematic bundle --schematic bootstrap/schematic/naslos.yaml --output naslos-installer.tar

customization:
  systemExtensions:
    officialExtensions:
      # ZFS extension provides the signed kernel module + zfs-service
      # which auto-imports pools at boot via zpool import -fal
      - siderolabs/zfs
