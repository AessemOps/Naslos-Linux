[package]
name = "naslos-vmd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Naslos QEMU/KVM supervisor (naslos-vmd)"

[[bin]]
name = "naslos-vmd"
path = "src/main.rs"

[lib]
name = "naslos_vmd"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Explicit, not just transitive: the crate graph pulls rustls via axum-server
# (ring) and reqwest (aws-lc-rs), which leaves both crypto providers compiled
# and makes rustls refuse to guess at startup. Declaring ring here mirrors the
# API crate and keeps the provider choice deliberate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
libc = "0.2"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
tempfile = "3"
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }

