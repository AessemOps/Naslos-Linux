[package]
name = "naslos-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Naslos HTTP API (Rust port of api/)"

[[bin]]
name = "naslos-api"
path = "src/main.rs"

[lib]
name = "naslos_api"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
hickory-resolver = "0.24"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
include_dir = "0.7"
ipnet = "2"
portable-pty = "0.8"
tar = "0.4"
libc = "0.2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "alloc", "rand_core", "std"] }
sha2 = "0.10"
tempfile = "3"
serde_json = "1"
serde_yaml = "0.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.60", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
