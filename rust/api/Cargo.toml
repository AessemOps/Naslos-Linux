[package]
name = "naslos-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Naslos HTTP API (Rust port of api/)"

[[bin]]
name = "naslos-api"
path = "src/main.rs"

[[bin]]
name = "naslos-upgrade"
path = "src/bin/naslos-upgrade.rs"

[lib]
name = "naslos_api"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
flate2 = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
axum-server = { version = "0.9", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
hickory-resolver = "0.26"
http = "1"
http-body-util = "0.1"
# S3-compatible object storage for cloud backup (docs/cloud-backup.md).
# Deliberately `aws-base` + our own reqwest 0.12 connector: the `aws` feature
# would pull a second reqwest major and the platform TLS verifier.
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "ring"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
include_dir = "0.7"
ipnet = "2"
naslos-vmd = { path = "../vmd", version = "0.1.0" }
portable-pty = "0.9"
tar = "0.4"
libc = "0.2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# Exact pin: rmcp has a churny API surface and the MCP protocol surface it
# exposes to clients moves with it (plan: naslos-mcp-server).
rmcp = { version = "=3.11.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# SMTP/syslog TLS transports (FR-ALT-07/09): tokio's rustls adapter and the
# compiled-in Mozilla trust anchors. Certificate validation is always on; there
# is deliberately no insecure/accept-any mode.
tokio-rustls = "0.26"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "alloc", "rand_core", "std"] }
sha2 = "0.11"
tempfile = "3"
serde_json = "1"
serde_yaml = "0.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tokio-tungstenite = "0.30"
# MCP dispatch calls the internal axum router via ServiceExt::oneshot.
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.61", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
