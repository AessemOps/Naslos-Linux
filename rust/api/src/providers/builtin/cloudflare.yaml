# apiRights text derived from cert-manager's DNS-01 provider docs:
# https://cert-manager.io/docs/configuration/acme/dns01/ — see CREDITS.md.

name: cloudflare
displayName: Cloudflare
description: Cloudflare DNS (API token).
icon: "🟧"
apiRights:
  - "API token permission: Zone → DNS → Edit"
  - "API token permission: Zone → Zone → Read"
  - "Scope the token to the zone(s) hosted here (not All Zones unless intended)"
fields:
  - key: apiToken
    label: API token
    type: string
    required: true
    secret: true
    # cert-manager's built-in cloudflare solver reads this key.
    secretKey: api-token
  - key: proxied
    label: Proxied (orange cloud)
    type: bool
    default: "false"
certManager:
  solver:
    cloudflare:
      apiTokenSecretRef:
        name: "${secret}"
        key: api-token
ddns:
  driver: cloudflare
