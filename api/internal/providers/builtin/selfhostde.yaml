name: selfhostde
displayName: selfhost.de
description: selfhost.de dynamic DNS; HTTP Basic auth (204 means no change).
icon: "🔴"
fields:
  - key: username
    label: Username
    type: string
    required: true
  - key: password
    label: Password
    type: string
    required: true
    secret: true
ddns:
  driver: http
  defaults:
    method: GET
    authType: basic
    successStatus: "200,204"
    successAny: good,nochg
    errorAny: badauth,notfqdn,nohost
    updateUrl: >-
      https://carol.selfhost.de/nic/update?hostname={{fqdn .record .zone}}&myip={{.ip}}
