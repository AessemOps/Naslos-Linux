# Naslos Helm values for the desktop installer (FR-INSTALL).
#
# This profile is shipped inside `naslos-install-pack-<version>.tar.gz` and is
# applied by the installer engine on top of values.yaml:
#
#   helm upgrade --install naslos charts/naslos -n naslos --create-namespace \
#     -f values.yaml -f values-installer.yaml \
#     --set domain=<name> --set shares.discovery.name=<short name> ...
#
# Unlike values-vm.yaml (the hand-managed VM), this file must NOT reference the
# private registry 192.168.1.2:30095: images come from the published repository
# base below. Only the repository base is parameterised; a digest/tag bump is a
# pack release. Bump the tags here (or via `--set`) in step with the CI build.
#
# The installer engine overrides, at install time:
#   domain, sso.domains, shares.discovery.name, openldap.host,
#   networkPolicy.{nodeCIDR,ingressPluginsCIDR,nfsClientCIDR}
# so the values below are coherent placeholders for the validated 192.168.1.0/24
# layout; do not assume they survive to a real install.

# --- images (published repository base, no private registry) ---
# NOTE (FR-INSTALL-13): the in-tree values are tag-pinned placeholders for local
# builds. A released pack is rewritten by `scripts/build-install-pack.sh` (via
# `scripts/pin-installer-values.py`) to pin every image by digest from the public
# `ghcr.io/aessemops/naslos-*` registry, because a tag is mutable and
# `IfNotPresent` can keep running older code after a retag. Keep the repositories
# and tags in step with the CI build.
api:
  image:
    repository: ghcr.io/aessemops/naslos-api
    tag: "0.7.63"
  # The API manages the node via the Talos API; the installer creates this
  # Secret from the kubeconfig/talosconfig it generated.
  talosConfigSecret: "naslos-talosconfig"
agent:
  image:
    repository: ghcr.io/aessemops/naslos-agent
    tag: "0.7.63"
ui:
  image:
    repository: ghcr.io/aessemops/naslos-ui
    tag: "0.7.63"
shares:
  smb:
    image:
      repository: ghcr.io/aessemops/naslos-samba
      tag: "0.7.63"
  nfs:
    image:
      repository: ghcr.io/aessemops/naslos-nfs
      tag: "0.7.63"
  # The advertised SMB/mDNS name. `shares.discovery.name` feeds both
  # SMB_DISCOVERY_NAME (samba) and SMB_NETBIOS_NAME (api), so clients see one
  # identity. The installer sets it to the chosen short name (the first label of
  # `domain` when the user does not override it).
  discovery:
    enabled: true
    name: "naslos"
terminal:
  image:
    repository: ghcr.io/aessemops/naslos-terminal
    tag: "0.7.63"
virt:
  image:
    repository: ghcr.io/aessemops/naslos-vmd
    tag: "0.7.63"
openldap:
  image: ghcr.io/aessemops/naslos-openldap:0.7.63

# --- identity ---
# The public name: session cookie domain, TOTP issuer and TLS SAN. The installer
# replaces it with the user's choice; `<name>.local` is the default.
domain: naslos.local
sso:
  domains:
    - naslos.local

# --- exposure: Traefik is the only listener, on the node's 80/443 ---
traefik:
  ports:
    web:
      hostPort: 80
    websecure:
      hostPort: 443
  service:
    type: ClusterIP
  # R-011: namespaced RBAC; watch the release namespace (the platform
  # IngressRoutes live there and the upstream namespaces helper does not add it
  # automatically), the shared app namespaces and the fixed per-app isolation
  # pool (same list as the VM overlay).
  rbac:
    namespaced: true
  providers:
    kubernetesCRD:
      namespaces:
        - naslos
        - naslos-apps
        - naslos-apps-priv
        - naslos-app-1
        - naslos-app-2
        - naslos-app-3
        - naslos-app-4
        - naslos-app-5
        - naslos-app-6
        - naslos-app-7
        - naslos-app-8
        - naslos-app-9
        - naslos-app-10
        - naslos-app-11
        - naslos-app-12
        - naslos-app-13
        - naslos-app-14
        - naslos-app-15
        - naslos-app-16
        - naslos-app-17
        - naslos-app-18
        - naslos-app-19
        - naslos-app-20
        - naslos-app-21
        - naslos-app-22
        - naslos-app-23
        - naslos-app-24
        - naslos-app-25
        - naslos-app-26
        - naslos-app-27
        - naslos-app-28
        - naslos-app-29
        - naslos-app-30
        - naslos-app-31
        - naslos-app-32
        - naslos-app-p1
        - naslos-app-p2
        - naslos-app-p3
        - naslos-app-p4
# The UI/API/portal IngressRoutes are enabled with the chart default; the
# Traefik RBAC and watch list live under `traefik` above. `ingress.rbac`
# and `ingress.providers` are not read by any template (a dead duplicate
# that shadowed nothing), so they were removed (C-8).
ingress:
  enabled: true

# --- app catalog / dynamic DNS ---
apps:
  namespace: naslos-apps
  isolation:
    enabled: true
  # Fresh installs use per-app claims only; no shared /var/mnt exposure.
  datasets:
    enabled: false
  officialSource:
    name: naslos
    displayName: NaslosCharts
    url: https://github.com/AessemOps/NaslosCharts.git
    auth: public
    # Follow the channel branch: every catalog refresh fetches `main`, so new
    # charts appear without a release. Set a full 40-character SHA here to pin
    # the catalog to an audited commit instead (SEC-2026-D6).
    credentialsSecret: ""
    channels:
      Prod: main
ddns:
  enabled: true

# --- NetworkPolicy CIDRs (the installer computes these from the node IP) ---
# `nodeCIDR` is the node's /24 (agent :9090, Talos API :50000, hostNetwork
# samba/nfs); `ingressPluginsCIDR` is the LAN the browser reaches Traefik from;
# `nfsClientCIDR` is the LAN allowed to mount NFS. With Cilium these are
# enforced, so a wrong value locks out the API server or the UI.
networkPolicy:
  nodeCIDR: 192.168.1.0/24
  # The engine overrides ingressPluginsCIDR with the node's /24; this extra
  # allow keeps public app domains reachable from the Internet. The proxy
  # still enforces Authelia and the per-app exposure rules.
  ingressPluginsCIDR: 192.168.1.0/24
  publicIngressCIDR: 0.0.0.0/0
  nfsClientCIDR: 192.168.1.0/24
  gitEgress: true
  ddnsEgress: true
  imageEgress: true

# --- optional subsystems ---
# The installer provisions cert-manager and the OVH DNS-01 webhook from the
# pack (manifests/cert-manager-crds.yaml + charts/cert-manager-webhook-ovh-*),
# the same way `make install-vm` installs them, so the Domains page can issue
# publicly trusted certificates once OVH credentials are entered.
# certManager.enabled stays false: the engine installs cert-manager as its own
# release, so enabling the subchart here would install it twice.
certManager:
  enabled: false
# RBAC that lets the webhook read a Domain's OVH credential Secret in the apps
# namespace; it must be on or certificate issuance fails with a forbidden read.
ovhWebhook:
  enabled: true
# Buddy Backup stays off until a receive dataset exists on the node; the UI can
# enable it later once a pool/dataset is created.
buddy:
  enabled: false
  receiveHostPath: ""
