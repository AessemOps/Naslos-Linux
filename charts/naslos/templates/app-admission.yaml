{{- /*
Admission guard for the Helm install identity (R-001, C-4).

RBAC already withholds Ingress/NetworkPolicy, traefik.io and cert-manager.io
writes from `naslos-helm`, and only lets it create ClusterIP Services and
non-platform Secrets. A future Role edit, an aggregated role or
`helm --force-conflicts` must not turn that into a silent exposure path, so
this ValidatingAdmissionPolicy independently enforces the same boundary:

  - no Ingress or NetworkPolicy (the API owns routing and isolation policy);
  - no traefik.io IngressRoute/Middleware/etc. (the API is the only route
    writer, so a chart can never hijack the UI's host or bypass forwardAuth);
  - no cert-manager.io/acme.cert-manager.io writes (the API owns certificates
    and issuers; a chart must not mint one for a host it does not own);
  - no Services other than ClusterIP without externalIPs (no NodePort,
    LoadBalancer or ExternalName exposure from a chart);
  - no writes to the platform's reserved Secrets, enumerated below (proxy
    and wildcard TLS, agent/vmd tokens and their pinned TLS CAs, Buddy
    identity and KEK, Authelia, OpenLDAP, Talos config, the chart deploy
    key, DDNS credentials, the API-written `naslos-env-*` app environment
    Secrets and the `naslos-dataset-key-*` dataset encryption keys). The
    list is enumerated rather than a blanket `naslos-` prefix because a Helm
    release whose own name starts with `naslos-` is legal and must be able
    to create its `<release>-...` Secrets;
  - no object whose metadata.namespace differs from the request namespace.

Deny-only chart NetworkPolicies are rejected too: the platform base policy is
the isolation contract, and admitting partial policies would reintroduce a
chart-controlled routing/policy surface.
*/}}
{{- $ans := .Values.apps.namespace | default "naslos-apps" }}
{{- if and .Values.ui.enabled (ne $ans .Release.Namespace) (ne $ans (include "naslos.workloadNamespace" .)) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: naslos-helm-app-isolation
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: app-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
        scope: Namespaced
  matchConditions:
    - name: helm-identity
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:naslos-helm'"
  validations:
    - expression: "!has(object.metadata.namespace) || object.metadata.namespace == request.namespace"
      message: "The Helm identity may not create or update an object whose metadata.namespace differs from the request namespace."
      reason: Forbidden
    - expression: "!(request.resource.group == 'networking.k8s.io' && (request.resource.resource == 'ingresses' || request.resource.resource == 'networkpolicies'))"
      message: "The Helm identity may not create or update Ingress or NetworkPolicy objects; the Naslos API owns app routing and isolation policy."
      reason: Forbidden
    - expression: "request.resource.group != 'traefik.io'"
      message: "The Helm identity may not create or update traefik.io objects (IngressRoute, Middleware, TLSOption, ...); the Naslos API owns every route, so a chart cannot hijack a host or bypass forwardAuth."
      reason: Forbidden
    - expression: "request.resource.group != 'cert-manager.io' && request.resource.group != 'acme.cert-manager.io'"
      message: "The Helm identity may not create or update cert-manager objects; the Naslos API owns certificates and issuers."
      reason: Forbidden
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'secrets' && (
        ['naslos-proxy', 'naslos-tls', 'naslos-agent', 'naslos-agent-tls', 'naslos-agent-ca',
        'naslos-vmd', 'naslos-vmd-tls', 'naslos-vmd-ca', 'naslos-buddy',
        'naslos-buddy-kek', 'naslos-authelia', 'naslos-authelia-jwt', 'naslos-openldap',
        'naslos-openldap-tls', 'naslos-openldap-ca', 'naslos-talosconfig',
        'naslos-charts-deploy-key'].exists(n, object.metadata.name == n)
        || ['naslos-ddns-', 'naslos-env-', 'naslos-dataset-key-'].exists(p, object.metadata.name.startsWith(p))))
      message: "The Helm identity may not create or update the platform's reserved Secrets (proxy/TLS, agent and vmd tokens, Buddy identity and KEK, Authelia, OpenLDAP, DDNS credentials, per-app env, Talos config, chart deploy key). Name chart Secrets `<release>-...`. A release whose own name collides with one of these reserved names or prefixes is refused."
      reason: Forbidden
    - expression: "!(request.resource.group == '' && request.resource.resource == 'services' && ((has(object.spec.type) && object.spec.type != 'ClusterIP') || (has(object.spec.externalIPs) && size(object.spec.externalIPs) > 0)))"
      message: "The Helm identity may only create ClusterIP Services without externalIPs; exposure goes through the Naslos API's IngressRoute."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: naslos-helm-app-isolation
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: app-isolation
spec:
  policyName: naslos-helm-app-isolation
  validationActions: ["Deny"]
{{- end }}
