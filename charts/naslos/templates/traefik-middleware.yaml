{{- if eq (include "naslos.ingressEnabled" .) "true" }}
---
# Authelia forwardAuth middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-authelia
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    # The authz path stays at the root even though the portal lives at
    # /authelia: Authelia serves both, and its docs recommend against embedding
    # the subpath in the authz URL. authelia_url pins the public portal URL so
    # redirects do not depend on any client-supplied X-Forwarded-Host.
    # The trailing slash matters: Authelia on a subpath redirects to `//?rd=…`
    # (which 404s) when authelia_url has no trailing slash.
    # The Service is the subchart's <release>-authelia (port 80 -> 9091); a
    # bare "authelia" name does not exist and Traefik 500s every route.
    address: http://{{ .Values.ingress.authelia.serviceName | default "naslos-authelia" }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ingress.authelia.port | default 80 }}/api/authz/forward-auth?authelia_url={{ printf "https://%s/authelia/" .Values.authelia.domain | urlquery }}
    # No trustForwardHeader (defaults to false): a client must not be able to
    # forge X-Forwarded-* and influence the auth decision or the API's
    # websocket origin check (NAS-009). Traefik sets those headers itself.
    maxResponseBodySize: 8192
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
# Headers middleware for security
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    stsIncludeSubdomains: true
    # No stsPreload: this is a .local host with a chart-generated self-signed
    # certificate, so preload can never be earned and HSTS otherwise removes the
    # "proceed anyway" path a user needs until they trust the cert.
    stsSeconds: 31536000
    customFrameOptionsValue: DENY
    referrerPolicy: strict-origin-when-cross-origin
{{- end }}
