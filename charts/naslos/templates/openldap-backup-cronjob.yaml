{{- /*
OpenLDAP nightly backup (FR-INSTALL). Folded from
openldap/manifests/backup-cronjob.yaml.

slapcat writes to the config volume (mounted a second time at /backups); the
data volume is mounted read-write because the mdb backend maps a lock file
beside the database even for a read. Both PVCs are created by the StatefulSet's
volumeClaimTemplates, so their names follow <template>-<statefulset>-0.
*/}}
{{- if .Values.openldap.enabled }}
{{- $backup := get .Values.openldap "backup" | default dict }}
{{- $backupEnabled := true }}
{{- if hasKey $backup "enabled" }}{{ $backupEnabled = index $backup "enabled" }}{{ end }}
{{- if $backupEnabled }}
{{- $sts := .Values.openldap.serviceName | default "naslos-openldap" }}
{{- $retain := index $backup "retain" | default 7 }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: naslos-openldap-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
spec:
  schedule: {{ index $backup "schedule" | default "0 3 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: naslos-openldap-backup
          containers:
            - name: backup
              image: "{{ .Values.openldap.image }}"
              imagePullPolicy: {{ .Values.openldap.imagePullPolicy | default "IfNotPresent" }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # Backups go on the config volume (mounted at /backups here).
                  BACKUP_DIR="/backups/ldap"
                  mkdir -p "${BACKUP_DIR}"
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)

                  # slapcat needs the *configuration* directory (-F) to know the
                  # databases; both commands read the live databases through it.
                  slapcat -F /etc/ldap/slapd.d -n 0 -l "${BACKUP_DIR}/config_${TIMESTAMP}.ldif"
                  slapcat -F /etc/ldap/slapd.d -n 1 -l "${BACKUP_DIR}/data_${TIMESTAMP}.ldif"

                  # Keep only the last {{ $retain }} of each.
                  ls -t "${BACKUP_DIR}"/config_*.ldif 2>/dev/null | tail -n +{{ add $retain 1 }} | xargs -r rm -f
                  ls -t "${BACKUP_DIR}"/data_*.ldif 2>/dev/null | tail -n +{{ add $retain 1 }} | xargs -r rm -f

                  echo "Backup completed: ${TIMESTAMP}"
              volumeMounts:
                # Both volumes are read-write: the mdb backend maps a lock file
                # next to the database, so a read-only mount fails with
                # "unable to open database" even though slapcat only reads.
                - name: data
                  mountPath: /var/lib/ldap
                - name: config
                  mountPath: /etc/ldap/slapd.d
                # The same config volume, mounted a second time as the backup
                # destination. It used to be mounted at /var/lib/ldap/backups,
                # i.e. *inside* the data mount, which the container runtime
                # cannot create when that mount is read-only - the pod never
                # started (RunContainerError).
                - name: config
                  mountPath: /backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ $sts }}-0
            - name: config
              persistentVolumeClaim:
                claimName: config-{{ $sts }}-0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-openldap-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
{{- end }}
{{- end }}
