{{- /*
NetworkPolicy intent for the Naslos namespace (AUDIT-M4).

These objects record the intended call graph. **They are inert on the current
flannel install**: flannel has no policy controller, so `NetworkPolicy` resources
are accepted by the API server and silently do nothing. They are NOT a complete
remediation even after a policy-capable CNI is installed, for two reasons the
operator must handle in the enforcement window:

1. The privileged agent is `hostNetwork` (and so are samba/nfs). Policy CNIs do
   not apply pod-level NetworkPolicy to host-network pods, so
   `naslos-agent-ingress` cannot restrict :9090 to the API by itself - that needs
   a node-level rule (Talos/nftables, or a Cilium host firewall policy keyed to
   the API pod IP).
2. Traefik binds hostPort 80/443, so the entry traffic's source is the node
   address, expressed here via `networkPolicy.ingressPluginsCIDR`.

The host/node CIDRs are configuration, not guesses: `networkPolicy.nodeCIDR`
defaults to empty because a wrong value silently breaks the enforcement window.
Set it (e.g. the node subnet) before installing a policy CNI.

Enabled by default: a no-op under flannel, and a latent protection when the CNI
changes. Set networkPolicy.enabled=false to skip rendering entirely.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Release.Namespace }}
{{- $ingressCIDR := .Values.networkPolicy.ingressPluginsCIDR | default "10.244.0.0/16" }}
{{- $probeCIDR := .Values.networkPolicy.probeCIDR | default "" }}
{{- $dnsCIDR := .Values.networkPolicy.dnsCIDR | default "169.254.0.0/16" }}
{{- $nodeCIDR := .Values.networkPolicy.nodeCIDR | default "" }}
{{- $serviceCIDR := .Values.networkPolicy.serviceCIDR | default "10.96.0.0/12" }}
---
# Default deny for every pod in the namespace. Every rule below is an additive
# allow; a pod with no matching policy is confined to its own namespace peers,
# which is a small blast radius but still not the intent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-default-deny
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/part-of: naslos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Agent: privileged, host-network, the only path to ZFS. The intent is :9090
# reachable by the API alone (traefik does not talk to it - the API does, over
# the headless Service). NOTE: this pod is hostNetwork, so a policy CNI will NOT
# enforce this podSelector (host-network pods carry the host identity and are
# exempt from pod-level NetworkPolicy). This object records the intent and is
# correct for the non-hostNetwork case; closing AUDIT-M4 for the real agent needs
# a node-level rule (Talos/nftables or a Cilium host firewall policy keyed to the
# API pod IP). Do not read this policy alone as "the API only".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-agent-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-api
      ports:
        - protocol: TCP
          port: 9090
---
# Traefik: the single entry point (hostPort 80/443). Under default-deny its own
# inbound must be allowed or the proxy serves nothing once a policy CNI lands.
# hostPort traffic arrives from the node address, so that is expressed as the
# `ingressPluginsCIDR` ipBlock; `probeCIDR` covers the kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-traefik-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ $ingressCIDR | quote }}
        {{- with $probeCIDR }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
---
# API: proxied by Traefik, and reached by the UI's nginx as the upstream for the
# relative /api/* calls (a second path that bypasses the proxy for static-asset
# serving; the API's own proxy-identity check still guards it). Kubelet probes
# hit the same port from the node address, so they match `probeCIDR` (NOT the pod
# CIDR - setting probeCIDR to the pod network would admit every pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-api-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-ui
        # Kubelet probes originate from the node, not the pod network.
        {{- with $probeCIDR }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# UI: proxied by Traefik; kubelet probes (nginx has no probes today but this
# keeps a future one working) from the node address via `probeCIDR`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-ui-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-ui
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        {{- with $probeCIDR }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# Authelia: the only consumer is Traefik, for both the forwardAuth subrequest and
# the portal route. Nothing else in the namespace has any business authenticating
# against it directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-authelia-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-authelia
    app.kubernetes.io/component: authelia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        {{- with $probeCIDR }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9091
---
# OpenLDAP: the API (identity), Authelia (authn backend) and Traefik (nothing
# today, kept explicit) hold credentials; the samba container authenticates
# share users through NSS/LDAP. All over ldaps:636 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-openldap-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-openldap
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-samba
      ports:
        - protocol: TCP
          port: 636
---
# Samba: host-network and bound to the SMB ports; the only in-cluster caller is
# the API (share/config reload and NSS reads). `users` DNS (445 is a service
# name the container publishes) is not needed by peers, so it stays closed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-samba-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-samba
    app.kubernetes.io/component: shares
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-samba
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-api
---
# NFS: host-network. Clients are LAN hosts outside the cluster, so policy cannot
# express them as a pod selector; the intent here is only to keep the port
# closed to unrelated pods. External clients are allowed by an ipBlock if the
# operator sets networkPolicy.nfsClientCIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-nfs-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-nfs
    app.kubernetes.io/component: shares
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: naslos-nfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: naslos-api
        {{- with .Values.networkPolicy.nfsClientCIDR }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 2049
---
# Egress for every workload.
#
# In-cluster peers are expressed as podSelectors (NOT ipBlocks): under Cilium an
# ipBlock rule does not match Pod or Service identities, so relying on the cluster
# CIDR alone would block LDAP/agent/DNS. The hostNetwork services the API must
# reach - the agent on :9090, the Talos API on :50000, and the Service ClusterIPs
# - are addressed by the operator-supplied `nodeCIDR`/`serviceCIDR`. These are
# deliberately explicit: a wrong guess silently breaks ZFS, shares and identity
# the moment a policy CNI enforces this. Cluster DNS is additionally allowed
# (Cilium forwards from 169.254.0.0/16 regardless of the cluster CIDR), and no
# blanket 0.0.0.0/0 is present because no workload has a documented outbound
# Internet dependency.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naslos-workload-egress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/part-of: naslos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Cluster DNS.
    - to:
        - ipBlock:
            cidr: {{ $dnsCIDR | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-cluster peers by identity: any pod in this namespace (API, Authelia,
    # Samba, OpenLDAP, UI, Traefik, Terminal) on any port, so the pod-to-pod
    # call graph is not re-encoded here and cannot drift from the platform.
    - to:
        - podSelector: {}
    # Service ClusterIPs (the API resolves naslos-openldap and the agent through
    # Services; some clients dial the ClusterIP rather than a Pod IP).
    {{- with $serviceCIDR }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    # Host/node addresses: hostNetwork services (agent :9090, samba/nfs, the
    # Talos API :50000) live at the node IP, outside the pod and service CIDRs.
    {{- with $nodeCIDR }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    {{- range .Values.networkPolicy.extraEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}
