{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: naslos-agent
  namespace: {{ include "naslos.workloadNamespace" . }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-agent
    spec:
      serviceAccountName: naslos-agent
      # hostNetwork keeps the agent reachable at the node's own address, which is
      # what the headless Service advertises one endpoint per node for (and what
      # AGENT_BASE_URL can be pointed at directly). Dropping it was attempted in
      # the NAS-002 review and deliberately kept: the agent chroots into /host and
      # is the only path to ZFS on the node, so changing its network identity
      # needs a live multi-node check, not a guess. hostPID is NOT required and is
      # not set (nothing in the agent reads host processes).
      hostNetwork: true
      containers:
        - name: agent
          image: {{ include "naslos.image" .Values.agent.image }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.agent.privileged }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The agent is privileged and host-networked, so it only serves
            # callers proving they are the API: every request but /health must
            # carry the shared bearer token (NAS-002). No opt-out.
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "naslos.agentTokenSecret" . | default "naslos-agent" }}
                  key: token
            {{- if .Values.agent.tls.enabled }}
            # PF-M5: serve HTTPS with the chart-generated agent certificate. The
            # API pins the same CA via AGENT_CA_FILE.
            - name: AGENT_TLS_CERT
              value: /etc/naslos/agent-tls/tls.crt
            - name: AGENT_TLS_KEY
              value: /etc/naslos/agent-tls/tls.key
            {{- end }}
          volumeMounts:
            # Host root for chroot /host zpool/zfs operations
            - name: host-root
              mountPath: /host
              mountPropagation: HostToContainer
            - name: host-dev
              mountPath: /dev
              mountPropagation: HostToContainer
            - name: host-run
              mountPath: /run
              mountPropagation: HostToContainer
            - name: host-var
              mountPath: /var
              mountPropagation: HostToContainer
            {{- if .Values.agent.tls.enabled }}
            - name: agent-tls
              mountPath: /etc/naslos/agent-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-run
          hostPath:
            path: /run
        - name: host-var
          hostPath:
            path: /var
        {{- if .Values.agent.tls.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ .Values.agent.tls.secretName | default "naslos-agent-tls" }}
        {{- end }}
---
# Headless Service for the agent DaemonSet: gives naslos-api a stable DNS
# name (naslos-agent.<namespace>.svc.cluster.local:9090) for ZFS pool
# operations without needing K8s RBAC for pod discovery. The agent is
# hostNetwork, so each endpoint is the node's address; on multi-node
# clusters DNS returns one A record per agent pod.
apiVersion: v1
kind: Service
metadata:
  name: naslos-agent
  namespace: {{ include "naslos.workloadNamespace" . }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: naslos-agent
  ports:
    - name: {{ if .Values.agent.tls.enabled }}https{{ else }}http{{ end }}
      port: {{ .Values.agent.service.port }}
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-agent
  namespace: {{ include "naslos.workloadNamespace" . }}
# No ClusterRole/ClusterRoleBinding: the agent never calls the Kubernetes API -
# it chroots into /host and runs zpool/zfs directly, and the API reaches it over
# its headless Service. The previous Role granted get/list/watch on every node,
# pod and pod log cluster-wide for nothing (AUDIT-M5).
{{- end }}
