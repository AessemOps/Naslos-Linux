{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: naslos-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-agent
    spec:
      serviceAccountName: naslos-agent
      hostPID: true
      hostNetwork: true
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.agent.privileged }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            # Host root for chroot /host zpool/zfs operations
            - name: host-root
              mountPath: /host
              mountPropagation: HostToContainer
            - name: host-dev
              mountPath: /dev
              mountPropagation: HostToContainer
            - name: host-run
              mountPath: /run
              mountPropagation: HostToContainer
            - name: host-var
              mountPath: /var
              mountPropagation: HostToContainer
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-run
          hostPath:
            path: /run
        - name: host-var
          hostPath:
            path: /var
---
# Headless Service for the agent DaemonSet: gives naslos-api a stable DNS
# name (naslos-agent.<namespace>.svc.cluster.local:9090) for ZFS pool
# operations without needing K8s RBAC for pod discovery. The agent is
# hostNetwork, so each endpoint is the node's address; on multi-node
# clusters DNS returns one A record per agent pod.
apiVersion: v1
kind: Service
metadata:
  name: naslos-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: naslos-agent
  ports:
    - name: http
      port: {{ .Values.agent.service.port }}
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-agent
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naslos-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: naslos-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: naslos-agent
subjects:
  - kind: ServiceAccount
    name: naslos-agent
    namespace: {{ .Values.namespace }}
{{- end }}
