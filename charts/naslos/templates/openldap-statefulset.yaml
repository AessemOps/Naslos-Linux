{{- /*
OpenLDAP directory server (FR-INSTALL). Folded into the umbrella chart from
openldap/manifests/statefulset.yaml so a declarative install owns it; see
AGENTS.md "Every fix must be in a fresh install".

The internal directory suffix is fixed (`LDAP_DOMAIN=naslos.local`, i.e.
`dc=naslos,dc=local`). It is baked into the mdb database on first boot and the
image's `bootstrap.ldif` hard-codes the same DNs, so it is intentionally NOT
derived from `.Values.domain` or configurable: changing it would orphan every
account. The public domain only drives the certificate SAN and Authelia's
`server_name` (via `openldap.host`).
*/}}
{{- if .Values.openldap.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.openldap.serviceName | default "naslos-openldap" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
spec:
  serviceName: {{ .Values.openldap.serviceName | default "naslos-openldap" }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-openldap
    spec:
      # fsGroup must match the openldap user's GID (101 in the Debian
      # image), not an arbitrary value — otherwise the group-owned
      # /container/service/slapd/assets/certs (mounted from a Secret
      # with defaultMode 0440 below) stays unreadable by openldap and
      # slapd fails at startup with "TLS: could not use CA certificate
      # file ...: Error while reading file".
      securityContext:
        fsGroup: 101
      containers:
        - name: openldap
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.openldap.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 636
              name: ldaps
          env:
            - name: LDAP_DOMAIN
              # Fixed on purpose: the image's bootstrap.ldif and the base DN the
              # API/Authelia use are all dc=naslos,dc=local. Not configurable.
              value: "naslos.local"
            - name: LDAP_ORGANISATION
              value: {{ .Values.openldap.organisation | default "Naslos" | quote }}
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: admin-password
            - name: LDAP_TLS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldap
            - name: config
              mountPath: /etc/ldap/slapd.d
            - name: certs
              mountPath: /container/service/slapd/assets/certs
              readOnly: true
          resources:
            {{- toYaml (.Values.openldap.resources | default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "1Gi"))) | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 636
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: certs
          secret:
            secretName: naslos-openldap-tls
            # 0440 (not 0400): the file must be group-readable so the
            # fsGroup-owned group (101 = openldap, set above) can read it
            # once slapd drops root privileges to the openldap user.
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.openldap.storageClassName | default "local-path" }}
        resources:
          requests:
            storage: {{ .Values.openldap.dataSize | default "1Gi" }}
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.openldap.storageClassName | default "local-path" }}
        resources:
          requests:
            storage: {{ .Values.openldap.configSize | default "100Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.openldap.serviceName | default "naslos-openldap" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: naslos-openldap
  ports:
    - port: 636
      targetPort: 636
      name: ldaps
{{- end }}
