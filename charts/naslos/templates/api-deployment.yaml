{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-api
    spec:
      serviceAccountName: naslos-api
      initContainers:
        # Best-effort ordering guard: wait briefly for OpenLDAP so a cold start
        # (both pods restarting together) does not serve identity errors in the
        # first seconds. It MUST NOT block indefinitely — if LDAP is genuinely
        # down we start anyway, because the API stays useful (dashboard, disks,
        # pools) and the identity client reconnects lazily on its own
        # (api/internal/identity/client.go). Blocking here would take the whole
        # UI down with LDAP.
        - name: wait-for-ldap
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: LDAPTLS_REQCERT
              value: never
          command:
            - sh
            - -c
            - |
              i=0
              while [ $i -lt {{ .Values.api.waitForLdap.retries | default 10 }} ]; do
                if ldapsearch -x -H ldaps://{{ .Values.openldap.serviceName }}:636 -b "" -s base >/dev/null 2>&1; then
                  echo "OpenLDAP is reachable."
                  exit 0
                fi
                i=$((i+1))
                echo "Waiting for OpenLDAP... ($i)"
                sleep {{ .Values.api.waitForLdap.intervalSeconds | default 1 }}
              done
              echo "OpenLDAP not reachable yet - starting anyway (identity will retry)." >&2
              exit 0
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          # Liveness only checks the process (no LDAP dependency), so an LDAP
          # outage never takes the dashboard down. /api/ready reports LDAP
          # state for observability without gating traffic on it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NASLOS_NAMESPACE
              value: {{ .Values.namespace }}
            # Base URL of the naslos-agent Service (headless, one endpoint per
            # node) used for ZFS pool operations. Overridable for local dev
            # (e.g. AGENT_BASE_URL=http://127.0.0.1:9090 with a port-forward).
            - name: AGENT_BASE_URL
              value: {{ .Values.api.agentBaseURL | default (printf "http://naslos-agent.%s.svc.cluster.local:9090" .Values.namespace) | quote }}
            {{- if .Values.api.talosConfigSecret }}
            # The talos machinery client library (api/internal/talos/client.go)
            # resolves its config via the TALOSCONFIG env var pointing at a
            # mounted talosconfig file (NOT a "TALOS_ENDPOINTS" var, which the
            # library never reads). Without this, the API pod fatals at
            # startup with "Failed to create Talos client: failed to
            # determine endpoints".
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
            {{- end }}
            - name: LDAP_BIND_PASS
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: service-password
            # Name Samba advertises itself as; kept in step with the mDNS/WSD
            # name published by the naslos-samba container so browsing clients
            # and direct connections see one identity.
            - name: SMB_NETBIOS_NAME
              value: {{ .Values.shares.discovery.name | quote }}
            {{- if .Values.api.sharesConfig.enabled }}
            # Where share definitions are persisted (see api/internal/shares).
            - name: SHARES_CONFIG
              value: {{ .Values.api.sharesConfig.file | default "/var/lib/naslos/shares.json" }}
            {{- end }}
            {{- if .Values.api.ldapCA.secretName }}
            - name: LDAP_CA_CERT
              value: /var/run/secrets/ldap.ca/ca.crt
            {{- end }}
          {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName .Values.api.sharesConfig.enabled .Values.api.datasetsHostPath }}
          volumeMounts:
            {{- if .Values.api.talosConfigSecret }}
            - name: talosconfig
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            {{- end }}
            {{- if .Values.api.ldapCA.secretName }}
            - name: ldap-ca
              mountPath: /var/run/secrets/ldap.ca
              readOnly: true
            {{- end }}
            {{- if .Values.api.sharesConfig.enabled }}
            # Persists share definitions across restarts.
            - name: shares-config
              mountPath: {{ .Values.api.sharesConfig.mountPath | default "/var/lib/naslos" }}
            {{- end }}
            {{- if .Values.api.datasetsHostPath }}
            # Read-only view of the share datasets so the API can list and
            # validate paths for the shares UI. Gated on a hostPath because it
            # pins the pod to a node (fine for the single-node layout).
            - name: datasets
              mountPath: /var/mnt
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName .Values.api.sharesConfig.enabled .Values.api.datasetsHostPath }}
      volumes:
        {{- if .Values.api.talosConfigSecret }}
        - name: talosconfig
          secret:
            secretName: {{ .Values.api.talosConfigSecret }}
            items:
              - key: talosconfig
                path: config
        {{- end }}
        {{- if .Values.api.ldapCA.secretName }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.api.ldapCA.secretName }}
            items:
              - key: {{ .Values.api.ldapCA.key | default "ca.crt" }}
                path: ca.crt
        {{- end }}
        {{- if .Values.api.sharesConfig.enabled }}
        - name: shares-config
          persistentVolumeClaim:
            claimName: naslos-shares-config
        {{- end }}
        {{- if .Values.api.datasetsHostPath }}
        - name: datasets
          hostPath:
            path: {{ .Values.api.datasetsHostPath }}
            type: Directory
        {{- end }}
      {{- end }}
---
{{- if .Values.api.sharesConfig.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naslos-shares-config
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.api.sharesConfig.size | default "64Mi" }}
  {{- if .Values.api.sharesConfig.storageClassName }}
  storageClassName: {{ .Values.api.sharesConfig.storageClassName }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: naslos-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
{{- end }}
