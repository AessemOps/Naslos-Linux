{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naslos-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-api
    spec:
      serviceAccountName: naslos-api
      initContainers:
        # Best-effort ordering guard: wait briefly for OpenLDAP so a cold start
        # (both pods restarting together) does not serve identity errors in the
        # first seconds. It MUST NOT block indefinitely — if LDAP is genuinely
        # down we start anyway, because the API stays useful (dashboard, disks,
        # pools) and the identity client reconnects lazily on its own
        # (api/internal/identity/client.go). Blocking here would take the whole
        # UI down with LDAP.
        - name: wait-for-ldap
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            {{- if .Values.api.ldapCA.secretName }}
            # Verify the server certificate against the Naslos CA instead of
            # disabling verification (AUDIT-L9). The CA is the self-signed cert
            # from naslos-openldap-tls, whose SAN includes naslos-openldap - the
            # host in the ldaps:// URI below.
            - name: LDAPTLS_CACERT
              value: /var/run/secrets/ldap.ca/ca.crt
            {{- else }}
            # PF-L9: no CA configured, so demand verification (the OpenLDAP
            # client default) instead of silently accepting any certificate.
            # The probe only waits, then starts anyway, so a verification
            # failure delays the API by the retry budget rather than blocking it.
            - name: LDAPTLS_REQCERT
              value: demand
            {{- end }}
          {{- if .Values.api.ldapCA.secretName }}
          volumeMounts:
            - name: ldap-ca
              mountPath: /var/run/secrets/ldap.ca
              readOnly: true
          {{- end }}
          command:
            - sh
            - -c
            - |
              i=0
              while [ $i -lt {{ .Values.api.waitForLdap.retries | default 10 }} ]; do
                if ldapsearch -x -H ldaps://{{ .Values.openldap.serviceName }}:636 -b "" -s base >/dev/null 2>&1; then
                  echo "OpenLDAP is reachable."
                  exit 0
                fi
                i=$((i+1))
                echo "Waiting for OpenLDAP... ($i)"
                sleep {{ .Values.api.waitForLdap.intervalSeconds | default 1 }}
              done
              echo "OpenLDAP not reachable yet - starting anyway (identity will retry)." >&2
              exit 0
        {{- if .Values.buddy.enabled }}
        # The receive dataset is created on the host (`zfs create`) and belongs to
        # root, but the API runs as 65532 and must write into it. Doing this by
        # hand was a documented step that, when missed, made every push fail with
        # "mkdir …: permission denied" while the UI looked healthy. Only the
        # dataset root is chowned: the per-key trees inside are created by the API
        # itself, so a recursive walk (slow on a large store) buys nothing.
        # The API image is distroless (no shell), so this reuses the Debian-based
        # OpenLDAP image that this pod already pulls for the LDAP wait above.
        - name: fix-receive-dataset-ownership
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
            - |
              target={{ .Values.buddy.receivePath | default "/var/lib/naslos/buddy" }}
              if [ ! -d "$target" ]; then
                echo "$target does not exist - is the receive dataset mounted?" >&2
                exit 1
              fi
              current=$(stat -c '%u:%g' "$target")
              if [ "$current" = "65532:65532" ]; then
                echo "Receive dataset already owned by 65532."
                exit 0
              fi
              chown 65532:65532 "$target" || {
                echo "cannot chown $target (currently $current): run 'chown 65532:65532' on the node" >&2
                exit 1
              }
              echo "Receive dataset $target chowned to 65532:65532 (was $current)."
          volumeMounts:
            - name: buddy-data
              mountPath: {{ .Values.buddy.receivePath | default "/var/lib/naslos/buddy" }}
        {{- end }}
      containers:
        - name: api
          image: {{ include "naslos.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # PF-L3: the API needs no privilege (it is not hostNetwork and only
          # mounts hostPaths read-only or pre-chowned). The release namespace
          # enforces PSA `privileged`, so nothing else constrains it; state the
          # posture here. The image already runs as nonroot (65532).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          # Liveness only checks the process (no LDAP dependency), so an LDAP
          # outage never takes the dashboard down. /api/ready reports LDAP
          # state for observability without gating traffic on it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NASLOS_NAMESPACE
              value: {{ .Release.Namespace }}
            # Base URL of the naslos-agent Service (headless, one endpoint per
            # node) used for ZFS pool operations. Overridable for local dev
            # (e.g. AGENT_BASE_URL=http://127.0.0.1:9090 with a port-forward).
            # AUDIT-M6: the agent lives in the privileged namespace, not the
            # release namespace, so the default targets that.
            - name: AGENT_BASE_URL
              value: {{ .Values.api.agentBaseURL | default (printf "%s://naslos-agent.%s.svc.cluster.local:9090" (ternary "https" "http" .Values.agent.tls.enabled) (include "naslos.workloadNamespace" .)) | quote }}
            {{- if .Values.agent.tls.enabled }}
            # PF-M5: pin the chart-generated agent CA so the TLS channel is
            # verified rather than opportunistic; the bearer token no longer
            # crosses the LAN in cleartext.
            - name: AGENT_CA_FILE
              value: /etc/naslos/agent-tls/ca.crt
            {{- end }}
            # Owner-route authentication (NAS-001). The API serves /api/* only to
            # requests carrying the shared secret that Traefik's proxy-identity
            # middleware injects; it refuses to start without it. No opt-out.
            - name: TRAEFIK_CIDR
              value: {{ include "naslos.authTraefikCIDR" . | quote }}
            - name: PROXY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "naslos.authProxySecretName" . | default "naslos-proxy" }}
                  key: secret
            # The bearer token the agent requires on every request but /health.
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "naslos.agentTokenSecret" . | default "naslos-agent" }}
                  key: token
            {{- if .Values.api.talosConfigSecret }}
            # The talos machinery client library (api/internal/talos/client.go)
            # resolves its config via the TALOSCONFIG env var pointing at a
            # mounted talosconfig file (NOT a "TALOS_ENDPOINTS" var, which the
            # library never reads). Without this, the API pod fatals at
            # startup with "Failed to create Talos client: failed to
            # determine endpoints".
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
            {{- end }}
            - name: LDAP_BIND_PASS
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: service-password
            # Name Samba advertises itself as; kept in step with the mDNS/WSD
            # name published by the naslos-samba container so browsing clients
            # and direct connections see one identity.
            - name: SMB_NETBIOS_NAME
              value: {{ .Values.shares.discovery.name | quote }}
            # PF-H4: the LAN allowed to reach the NAS. Used as the default client
            # restriction for a share that names none, so shares are never
            # exported to the world by omission. Explicit "*" in a share's
            # allowedHosts is the only way to widen it.
            - name: NASLOS_LAN_CIDR
              value: {{ .Values.networkPolicy.nfsClientCIDR | default "" | quote }}
            {{- if .Values.api.sharesConfig.enabled }}
            # Where share definitions are persisted (see api/internal/shares).
            - name: SHARES_CONFIG
              value: {{ .Values.api.sharesConfig.file | default "/var/lib/naslos/shares.json" }}
            {{- end }}
            # Notification settings: kept on the same volume as the other state
            # files so an operator's topic, token and enabled events survive a
            # restart (they used to be in-memory only).
            - name: NOTIFICATIONS_CONFIG
              value: {{ .Values.api.notificationsFile | default "/var/lib/naslos/notifications.json" | quote }}
            {{- if .Values.buddy.enabled }}
            # Buddy Backup receive side (docs/buddy-backup.md): peers push
            # encrypted chunks that this instance stores but cannot read. The
            # peer registry lives beside the other state files; the chunks live
            # on their own dataset.
            - name: BUDDY_NAME
              value: {{ .Values.buddy.name | default "naslos" | quote }}
            - name: BUDDY_RECEIVE_PATH
              value: {{ .Values.buddy.receivePath | default "/var/lib/naslos/buddy" | quote }}
            - name: BUDDY_PEERS
              value: {{ .Values.buddy.peersFile | default "/var/lib/naslos/buddy-peers.json" | quote }}
            # Scheduled backups: the store beside the other state files, and the
            # runner's tick. Both used to rely on the compiled-in defaults.
            - name: BUDDY_SCHEDULES
              value: {{ .Values.buddy.schedulesFile | default "/var/lib/naslos/buddy-schedules.json" | quote }}
            - name: BUDDY_SCHEDULER_INTERVAL_MS
              value: {{ .Values.buddy.schedulerIntervalMs | default 60000 | quote }}
            {{- if or .Values.buddy.enrollToken .Values.buddy.enrollTokenSecret }}
            - name: BUDDY_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.buddy.enrollTokenSecret | default "naslos-buddy" }}
                  key: enrollToken
            {{- end }}
            {{- if .Values.buddy.kekSecret }}
            # PF-M14: take the key-encryption key from a Secret instead of the
            # identity file, so a read of that file does not also yield the key
            # that unwraps every backup. Key must be `kek` (base64, 32 bytes).
            - name: BUDDY_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.buddy.kekSecret }}
                  key: {{ .Values.buddy.kekSecretKey | default "kek" }}
            {{- end }}
            {{- end }}
            {{- if .Values.api.ldapCA.secretName }}
            - name: LDAP_CA_CERT
              value: /var/run/secrets/ldap.ca/ca.crt
            {{- end }}
          {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName .Values.api.sharesConfig.enabled .Values.api.datasetsHostPath .Values.buddy.enabled .Values.agent.tls.enabled }}
          volumeMounts:
            {{- if .Values.agent.tls.enabled }}
            - name: agent-tls
              mountPath: /etc/naslos/agent-tls
              readOnly: true
            {{- end }}
            {{- if .Values.api.talosConfigSecret }}
            - name: talosconfig
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            {{- end }}
            {{- if .Values.api.ldapCA.secretName }}
            - name: ldap-ca
              mountPath: /var/run/secrets/ldap.ca
              readOnly: true
            {{- end }}
            {{- if .Values.api.sharesConfig.enabled }}
            # Persists share definitions across restarts.
            - name: shares-config
              mountPath: {{ .Values.api.sharesConfig.mountPath | default "/var/lib/naslos" }}
            {{- end }}
            {{- if .Values.buddy.enabled }}
            # The Buddy Backup receive dataset. It is the only read-write host
            # path this pod gets, and it is a dataset of its own for two reasons:
            # a backup volume must be able to fill up without taking the OS with
            # it, and the API can only ever write opaque ciphertext into it.
            - name: buddy-data
              mountPath: {{ .Values.buddy.receivePath | default "/var/lib/naslos/buddy" }}
            {{- end }}
            {{- if .Values.api.datasetsHostPath }}
            # Read-only view of the share datasets so the API can list and
            # validate paths for the shares UI. Gated on a hostPath because it
            # pins the pod to a node (fine for the single-node layout).
            # HostToContainer so datasets mounted after this pod starts (pool
            # import on boot) become visible for validation.
            - name: datasets
              mountPath: /var/mnt
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName .Values.api.sharesConfig.enabled .Values.api.datasetsHostPath .Values.buddy.enabled .Values.agent.tls.enabled }}
      volumes:
        {{- if .Values.agent.tls.enabled }}
        - name: agent-tls
          secret:
            # CA-only copy in the API namespace (the agent's Secret, with the
            # server key, lives in the privileged namespace and cannot be
            # mounted across namespaces).
            secretName: {{ .Values.agent.tls.secretName | default "naslos-agent-tls" }}-ca
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.api.talosConfigSecret }}
        - name: talosconfig
          secret:
            secretName: {{ .Values.api.talosConfigSecret }}
            items:
              - key: talosconfig
                path: config
        {{- end }}
        {{- if .Values.api.ldapCA.secretName }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.api.ldapCA.secretName }}
            items:
              - key: {{ .Values.api.ldapCA.key | default "ca.crt" }}
                path: ca.crt
        {{- end }}
        {{- if .Values.api.sharesConfig.enabled }}
        - name: shares-config
          persistentVolumeClaim:
            claimName: naslos-shares-config
        {{- end }}
        {{- if .Values.api.datasetsHostPath }}
        - name: datasets
          hostPath:
            path: {{ .Values.api.datasetsHostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.buddy.enabled }}
        - name: buddy-data
          hostPath:
            # Must already exist: `zfs create <pool>/naslos-buddy`
            # (see docs/buddy-backup.md). Created here rather than by the API
            # because the API is deliberately not a host writer.
            path: {{ required "buddy.receiveHostPath is required when buddy.enabled=true: it is the dataset that stores received chunks" .Values.buddy.receiveHostPath }}
            type: Directory
        {{- end }}
      {{- end }}
---
{{- if .Values.api.sharesConfig.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naslos-shares-config
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.api.sharesConfig.size | default "64Mi" }}
  {{- if .Values.api.sharesConfig.storageClassName }}
  storageClassName: {{ .Values.api.sharesConfig.storageClassName }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-api
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: naslos-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-api
  namespace: {{ .Release.Namespace }}
{{- end }}
