{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-api
    spec:
      serviceAccountName: naslos-api
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NASLOS_NAMESPACE
              value: {{ .Values.namespace }}
            # Base URL of the naslos-agent Service (headless, one endpoint per
            # node) used for ZFS pool operations. Overridable for local dev
            # (e.g. AGENT_BASE_URL=http://127.0.0.1:9090 with a port-forward).
            - name: AGENT_BASE_URL
              value: {{ .Values.api.agentBaseURL | default (printf "http://naslos-agent.%s.svc.cluster.local:9090" .Values.namespace) | quote }}
            {{- if .Values.api.talosConfigSecret }}
            # The talos machinery client library (api/internal/talos/client.go)
            # resolves its config via the TALOSCONFIG env var pointing at a
            # mounted talosconfig file (NOT a "TALOS_ENDPOINTS" var, which the
            # library never reads). Without this, the API pod fatals at
            # startup with "Failed to create Talos client: failed to
            # determine endpoints".
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
            {{- end }}
            - name: LDAP_BIND_PASS
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: service-password
            {{- if .Values.api.ldapCA.secretName }}
            - name: LDAP_CA_CERT
              value: /var/run/secrets/ldap.ca/ca.crt
            {{- end }}
          {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName }}
          volumeMounts:
            {{- if .Values.api.talosConfigSecret }}
            - name: talosconfig
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            {{- end }}
            {{- if .Values.api.ldapCA.secretName }}
            - name: ldap-ca
              mountPath: /var/run/secrets/ldap.ca
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if or .Values.api.talosConfigSecret .Values.api.ldapCA.secretName }}
      volumes:
        {{- if .Values.api.talosConfigSecret }}
        - name: talosconfig
          secret:
            secretName: {{ .Values.api.talosConfigSecret }}
            items:
              - key: talosconfig
                path: config
        {{- end }}
        {{- if .Values.api.ldapCA.secretName }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.api.ldapCA.secretName }}
            items:
              - key: {{ .Values.api.ldapCA.key | default "ca.crt" }}
                path: ca.crt
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: naslos-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
{{- end }}
