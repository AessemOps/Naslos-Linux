{{- /*
ZFS dataset encryption key custody (FR-ENC-03).

Each encrypted dataset's 32-byte raw key lives in a Secret in a dedicated
namespace. The API gets CRUD on Secrets there and nothing else: keeping the keys
out of the release namespace means the API still cannot read the proxy, LDAP,
Authelia or Buddy secrets (docs/dataset-encryption.md). No workload runs in
this namespace, and the keep annotation is load-bearing: datasets live on the
host, so deleting the namespace on uninstall would destroy the only key copy.
*/}}
{{- if .Values.api.enabled }}
{{- $keys := .Values.datasetEncryption.keysNamespace | default "naslos-keys" }}
{{- if ne $keys .Release.Namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $keys }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/part-of: naslos
    app.kubernetes.io/component: dataset-keys
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: naslos-dataset-keys
  namespace: {{ $keys }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: dataset-keys
rules:
  # No list/watch: the API addresses a key by its deterministic name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: naslos-dataset-keys
  namespace: {{ $keys }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: dataset-keys
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: naslos-dataset-keys
subjects:
  - kind: ServiceAccount
    name: naslos-api
    namespace: {{ .Release.Namespace }}
{{- end }}
