# Buddy Backup enrollment secret (docs/buddy-backup.md).
#
# The token is what lets a peer authorize its own key on first contact. It is
# single use by design (the receiver refuses it a second time), but it is still a
# credential: prefer creating this Secret out of band and setting
# buddy.enrollTokenSecret, so the token never lands in the Helm release.
{{- if and .Values.buddy.enabled .Values.buddy.enrollToken (not .Values.buddy.enrollTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: naslos-buddy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: buddy-backup
type: Opaque
stringData:
  enrollToken: {{ .Values.buddy.enrollToken | quote }}
{{- end }}
