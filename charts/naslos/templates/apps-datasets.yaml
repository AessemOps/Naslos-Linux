# Datasets volume for installed apps.
#
# PSA `baseline` (the apps namespace) forbids hostPath volumes, but Naslos
# datasets are host directories. Exposing them as a static PV + PVC lets an app
# mount its library with a normal persistentVolumeClaim volume (allowed under
# baseline) instead of a hostPath. The single-node hostPath PV is declared
# ReadWriteMany because Kubernetes does not enforce access modes for hostPath and
# every app pod runs on the same node.
{{- if .Values.apps.datasets.enabled }}
{{- $root := .Values.apps.datasets.hostPath | default "/var/mnt" }}
{{- if not (hasPrefix "/" $root) }}
{{- fail "apps.datasets.hostPath must be an absolute path" }}
{{- end }}
{{- if has $root (list "/" "/var" "/etc" "/home" "/root" "/usr" "/system") }}
{{- fail "apps.datasets.hostPath must be a dedicated data directory, not a system directory or a filesystem root" }}
{{- end }}
{{- if and .Values.buddy.enabled .Values.buddy.receiveHostPath (not .Values.apps.datasets.allowBuddyStore) }}
{{- $buddy := .Values.buddy.receiveHostPath }}
{{- if or (eq $buddy $root) (hasPrefix (printf "%s/" (trimSuffix "/" $root)) $buddy) }}
{{- fail "buddy.receiveHostPath is inside apps.datasets.hostPath; mount the Buddy store outside the exposed root or set apps.datasets.allowBuddyStore=true to accept D3/F1" }}
{{- end }}
{{- end }}
{{- $ans := .Values.apps.namespace | default "naslos-apps" }}
{{- $wns := include "naslos.workloadNamespace" . }}
{{- $size := .Values.apps.datasets.size | default "10Ti" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: naslos-datasets
  labels:
    app.kubernetes.io/name: naslos
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ $size }}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: naslos-datasets
  hostPath:
    path: {{ $root }}
{{- if and (ne $ans .Release.Namespace) (ne $ans $wns) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naslos-datasets
  namespace: {{ $ans }}
  labels:
    app.kubernetes.io/name: naslos
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: naslos-datasets
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
{{- end }}
