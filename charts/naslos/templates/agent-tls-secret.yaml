{{- /*
TLS material for the naslos-agent <-> naslos-api channel (PF-M5).

The agent is a privileged, hostNetwork DaemonSet, so a NetworkPolicy cannot
protect it and the shared bearer token would otherwise cross the LAN in
cleartext. This template generates a CA and a server certificate for the agent
Service:

  <name>      in the workload namespace: ca.crt + tls.crt + tls.key for the agent
  <name>-ca   in the release namespace: ca.crt only, for the API to pin

Two Secrets are needed because a pod may only mount a Secret in its own
namespace, and the agent (privileged namespace) and the API (release namespace)
are split when workloadNamespace is set. Both carry the same CA.

Like tls-secret.yaml it generates once and then reuses: `lookup` reads the
existing Secret on every upgrade and re-emits it, so the material does not
rotate. `helm template`/`--dry-run` have no cluster to look up and render a
fresh certificate each time, which is expected.

Both branches emit a base64 `data:` block: a looked-up Secret returns its values
already base64-encoded, while a generated one must be encoded with b64enc.
Emitting the looked-up value through `stringData` would double-encode it and the
API would reject the CA.

Set `agent.tls.enabled=false` to serve plain HTTP (local development only).
*/}}
{{- if and .Values.agent.enabled .Values.agent.tls.enabled }}
{{- $ns := include "naslos.workloadNamespace" . }}
{{- $apiNS := .Release.Namespace }}
{{- $name := .Values.agent.tls.secretName | default "naslos-agent-tls" }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $caB64 := "" }}
{{- $certB64 := "" }}
{{- $keyB64 := "" }}
{{- if $existing }}
{{- $caB64 = index $existing.data "ca.crt" | default "" }}
{{- $certB64 = index $existing.data "tls.crt" | default "" }}
{{- $keyB64 = index $existing.data "tls.key" | default "" }}
{{- end }}
{{- if not (and $caB64 $certB64 $keyB64) }}
{{- $ca := genCA "naslos-agent-ca" 3650 }}
{{- $dns := list "naslos-agent" (printf "naslos-agent.%s" $ns) (printf "naslos-agent.%s.svc" $ns) (printf "naslos-agent.%s.svc.cluster.local" $ns) }}
{{- $cert := genSignedCert "naslos-agent" (list) $dns 3650 $ca }}
{{- $caB64 = $ca.Cert | b64enc }}
{{- $certB64 = $cert.Cert | b64enc }}
{{- $keyB64 = $cert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.crt: {{ $caB64 }}
  tls.crt: {{ $certB64 }}
  tls.key: {{ $keyB64 }}
---
# The API pins the agent certificate against this CA. A pod can only mount a
# Secret from its own namespace, so the CA is also emitted in the release
# namespace (and always, so the API has a stable object to mount either way).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ca
  namespace: {{ $apiNS }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.crt: {{ $caB64 }}
{{- end }}
