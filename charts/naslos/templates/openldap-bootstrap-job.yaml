{{- /*
OpenLDAP bootstrap Job (FR-INSTALL). Folded from
openldap/manifests/bootstrap-job.yaml.

It seeds the service-account password and verifies the groups created by the
image's bootstrap.ldif, over ldaps:// (never ldapi:// — a separate pod cannot
reach the server's Unix socket).

Rendered as a post-install/post-upgrade Helm hook with the
`before-hook-creation` delete policy: a Job's pod template is immutable, so a
plain chart resource would make every image-tag bump fail the upgrade. The hook
recreates it each time; `ttlSecondsAfterFinished` garbage-collects the pod.
*/}}
{{- if .Values.openldap.enabled }}
{{- $baseDN := include "naslos.openldapBaseDN" . }}
{{- $bindDN := include "naslos.openldapBindDN" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: naslos-openldap-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        job-name: naslos-openldap-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: naslos-openldap-bootstrap
      # The bootstrap script only runs ldapmodify/ldapsearch — it never
      # calls the Kubernetes API — so the projected service-account token
      # is not needed. On this cluster, projecting it triggers a runc
      # mount error at container init ("create mountpoint ... Read-only
      # file system") that fails the container before entrypoint even
      # runs; disabling the automount avoids that mount altogether.
      automountServiceAccountToken: false
      initContainers:
        # Wait for OpenLDAP to be ready (uses ldapsearch from the Naslos
        # OpenLDAP image so the VM does not need to pull busybox externally).
        - name: wait-for-ldap
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.openldap.imagePullPolicy | default "IfNotPresent" }}
          env:
            # Verify the server certificate against the Naslos CA rather than
            # disabling verification (AUDIT-L9).
            - name: LDAPTLS_CACERT
              value: /ldap-ca/ca.crt
          volumeMounts:
            - name: ldap-ca
              mountPath: /ldap-ca
              readOnly: true
          command:
            - sh
            - -c
            - |
              until ldapsearch -x -H ldaps://{{ .Values.openldap.serviceName | default "naslos-openldap" }}:636 -b "" -s base >/dev/null 2>&1; do
                echo "Waiting for OpenLDAP..."
                sleep 2
              done
              echo "OpenLDAP is ready"
      containers:
        - name: bootstrap
          image: "{{ .Values.openldap.image }}"
          imagePullPolicy: {{ .Values.openldap.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: LDAPTLS_CACERT
              value: /ldap-ca/ca.crt
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Configuring OpenLDAP..."

              # NOTE: ldapi:/// is a Unix domain socket only reachable from
              # inside the openldap server's own container/network
              # namespace. This Job runs in a separate pod, so it must
              # connect over the network via ldaps://<service>:636 (same as
              # the wait-for-ldap init container above) — using ldapi:///
              # here fails with "Can't contact LDAP server (-1)".
              LDAP_URI="ldaps://{{ .Values.openldap.serviceName | default "naslos-openldap" }}:636"

              # Update service account password
              SERVICE_PW=$(cat /run/secrets/service-password)
              SERVICE_PW_HASH=$(slappasswd -h "{SSHA}" -s "$SERVICE_PW")

              cat > /tmp/update-service-pw.ldif <<EOF
              dn: {{ $bindDN }}
              changetype: modify
              replace: userPassword
              userPassword: $SERVICE_PW_HASH
              EOF

              ldapmodify -x -H "$LDAP_URI" -D "cn=admin,{{ $baseDN }}" -w "$(cat /run/secrets/admin-password)" -f /tmp/update-service-pw.ldif

              # Verify groups exist (created by bootstrap.ldif)
              echo "Verifying groups..."
              ldapsearch -x -H "$LDAP_URI" -D "cn=admin,{{ $baseDN }}" -w "$(cat /run/secrets/admin-password)" \
                -b "cn=naslos_admins,ou=groups,{{ $baseDN }}" -s base "(objectClass=*)" cn

              echo "OpenLDAP bootstrap completed successfully!"
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: ldap-ca
              mountPath: /ldap-ca
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: naslos-openldap
            items:
              - key: admin-password
                path: admin-password
              - key: service-password
                path: service-password
        - name: ldap-ca
          secret:
            secretName: naslos-openldap-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-openldap-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
# No Role/RoleBinding: the Job only runs ldapmodify/ldapsearch over the network
# (ldaps://<service>:636) and never calls the Kubernetes API - it even sets
# automountServiceAccountToken: false. The Role previously granted get/list on
# pods and create on pods/exec (trivy KSV-0053), which is a known escalation
# path and was entirely unused.
{{- end }}
