{{- /*
Proxy shared secret (NAS-001).

The API only serves owner routes to a request carrying this value, which the
`proxy-identity` Traefik Middleware below injects. It lives in the same file as
the Middleware because the Middleware needs the literal value: computing it in
two templates would generate different randoms on the first install, before the
Secret exists.

Resolution order:
  1. `auth.proxySecret` — used verbatim (dry runs, development).
  2. the existing `naslos-proxy` Secret's `secret` key (upgrades) via lookup.
  3. a fresh random value (first install).

Set `auth.proxySecretName` to use a Secret you manage out of band instead; it must
have a `secret` key (the Middleware reads it through lookup, so it can only be
resolved against a live cluster).
*/}}
{{- $secretName := include "naslos.authProxySecretName" . | default "naslos-proxy" }}
{{- $proxySecret := include "naslos.authProxySecret" . }}
{{- if not $proxySecret }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- if and $existing (index $existing.data "secret") }}
{{- $proxySecret = index $existing.data "secret" | b64dec }}
{{- else if not (include "naslos.authProxySecretName" .) }}
{{- $proxySecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
{{- if not (include "naslos.authProxySecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: naslos-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  secret: {{ $proxySecret | quote }}
{{- end }}
{{- if eq (include "naslos.ingressEnabled" .) "true" }}
---
# Injects the shared secret on every request Traefik forwards. The API rejects
# owner requests without it, so a client that reaches the API another way
# (another pod, a stale listener) cannot forge a session by sending Remote-User
# itself.
#
# The value is readable by anyone who can read this Middleware or the Secret in
# the namespace - the same trust domain as the API's own configuration.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: proxy-identity
  namespace: {{ .Values.namespace }}
spec:
  headers:
    customRequestHeaders:
        X-Naslos-Proxy-Secret: {{ required "auth.proxySecret or an existing Secret with a 'secret' key is required" $proxySecret | quote }}
{{- end }}
