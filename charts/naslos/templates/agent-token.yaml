{{- /*
Agent bearer token (NAS-002).

The privileged, host-networked agent only serves requests carrying this token
(except its /health probe). Resolution order:
  1. the existing `naslos-agent` Secret's `token` key (upgrades) via lookup;
  2. a fresh random value (first install).

Set `agent.tokenSecret` to use a Secret you manage out of band instead; it must
have a `token` key.
*/}}
{{- if not .Values.auth.disabled }}
{{- $secretName := .Values.agent.tokenSecret | default "naslos-agent" }}
{{- $agentToken := "" }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- if and $existing (index $existing.data "token") }}
{{- $agentToken = index $existing.data "token" | b64dec }}
{{- else if not .Values.agent.tokenSecret }}
{{- $agentToken = randAlphaNum 48 }}
{{- end }}
{{- if not .Values.agent.tokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: naslos-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-agent
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  token: {{ required "agent token could not be resolved (set agent.tokenSecret to an existing Secret with a 'token' key)" $agentToken | quote }}
{{- end }}
{{- end }}
