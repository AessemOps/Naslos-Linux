{{- /*
OpenLDAP credentials and TLS material (FR-INSTALL).

Historically these two Secrets were created out of band by
`openldap/generate-secrets.sh` and the chart merely *consumed* them: the Authelia
config template failed closed when `naslos-openldap` was missing. The chart now
owns them so a bare `helm install` (and the desktop installer) needs no external
step, while still being non-destructive:

  - `lookup` reads the existing Secret on every upgrade and re-emits its bytes,
    so the passwords and certificate do NOT rotate (a rotation here would break
    the running OpenLDAP database and the Authelia bind).
  - `openldap.adminPassword` / `openldap.bindPassword` are used only when the
    Secret (or the specific key) does not already exist — i.e. for a dry run or
    the very first install. On an existing install they are ignored by design;
    rotate by patching the Secret and re-running the bootstrap Job (see
    docs/deployment.md).
  - The Secret names are fixed: `naslos-openldap` and `naslos-openldap-tls`.
    Every consumer (OpenLDAP itself, the API's LDAP CA mount and Authelia's bind
    mount/CA trust) references those literal names, so a rename override would
    leave dangling references. To bring your own material, pre-create Secrets
    with these names; the lookup below preserves them.
  - Both Secrets carry `helm.sh/resource-policy: keep`: `helm uninstall` keeps
    the namespace and the OpenLDAP PVCs (whose database has the root password
    baked in), so deleting the credentials would make a later reinstall
    re-key against live data and lock the directory out.

Caveat: `helm template` / `--dry-run` have no cluster to look up, so they render
freshly generated credentials each time. Only a real install/upgrade persists
them.

The certificate SANs cover the Service name `naslos-openldap`, `localhost`,
`127.0.0.1`, and the fixed `ldap.<suffix>` CN, plus `openldap.host` when set
(Authelia's `server_name`).
*/}}
{{- if .Values.openldap.enabled }}
{{- $pwName := "naslos-openldap" }}
{{- $tlsSecretName := "naslos-openldap-tls" }}
{{- $existingPW := lookup "v1" "Secret" .Release.Namespace $pwName }}
{{- $admin := "" }}
{{- $service := "" }}
{{- if $existingPW }}
{{- $admin = index $existingPW.data "admin-password" | default "" | b64dec }}
{{- $service = index $existingPW.data "service-password" | default "" | b64dec }}
{{- end }}
{{- if not $admin }}{{ $admin = .Values.openldap.adminPassword | default (randAlphaNum 48) }}{{ end }}
{{- if not $service }}{{ $service = .Values.openldap.bindPassword | default (randAlphaNum 48) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pwName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ $admin | quote }}
  service-password: {{ $service | quote }}
---
{{- $existingTLS := lookup "v1" "Secret" .Release.Namespace $tlsSecretName }}
{{- if $existingTLS }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity-tls
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{ toYaml $existingTLS.data | indent 2 }}
{{- else }}
{{- $cn := "ldap.naslos.local" }}
{{- $altNames := list $cn "naslos-openldap" "localhost" }}
{{- $host := .Values.openldap.host | default "" }}
{{- if and $host (ne $host $cn) }}
{{- $altNames = append $altNames $host }}
{{- end }}
{{- $ca := genCA "naslos-openldap-ca" 3650 }}
{{- $cert := genSignedCert $cn (list "127.0.0.1") $altNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-openldap
    app.kubernetes.io/component: identity-tls
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  ldap.crt: {{ $cert.Cert | quote }}
  ldap.key: {{ $cert.Key | quote }}
{{- end }}
{{- end }}
