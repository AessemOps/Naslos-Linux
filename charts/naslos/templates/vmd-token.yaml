{{- /*
vmd bearer token (the NAS-002 agent pattern, applied to the QEMU supervisor).

The privileged, host-networked vmd only serves requests carrying this token
(except its /health probe). Resolution order:
  1. an existing `naslos-vmd` Secret's `token` key (upgrades) via lookup, in the
     workload namespace first, then the release namespace (pre-split installs);
  2. a fresh random value (first install).

The Secret is rendered in BOTH namespaces: the vmd pod reads it beside itself
in the workload namespace, and the API pod reads it beside itself in the
release namespace. A secretKeyRef cannot cross namespaces, so the two copies
are required; the lookup above is what keeps them in sync across upgrades.

Set `virt.tokenSecret` to use a Secret you manage out of band instead; it must
have a `token` key.
*/}}
{{- $secretName := "" }}
{{- $virt := get .Values "virt" | default dict }}
{{- if $virt }}{{ $secretName = index $virt "tokenSecret" | default "" }}{{ end }}
{{- if and $virt.enabled (not $secretName) }}
{{- $wns := include "naslos.workloadNamespace" . }}
{{- $vmdToken := "" }}
{{- $inWorkloadNs := lookup "v1" "Secret" $wns "naslos-vmd" }}
{{- $inReleaseNs := lookup "v1" "Secret" .Release.Namespace "naslos-vmd" }}
{{- if and $inWorkloadNs (index $inWorkloadNs.data "token") }}
{{- $vmdToken = index $inWorkloadNs.data "token" | b64dec }}
{{- else if and $inReleaseNs (index $inReleaseNs.data "token") }}
{{- $vmdToken = index $inReleaseNs.data "token" | b64dec }}
{{- else }}
{{- $vmdToken = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: naslos-vmd
  namespace: {{ $wns }}
  labels:
    app.kubernetes.io/name: naslos-vmd
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  token: {{ required "vmd token could not be resolved (set virt.tokenSecret to an existing Secret with a 'token' key)" $vmdToken | quote }}
{{- if ne $wns .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: naslos-vmd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos-vmd
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  token: {{ required "vmd token could not be resolved (set virt.tokenSecret to an existing Secret with a 'token' key)" $vmdToken | quote }}
{{- end }}
{{- end }}
