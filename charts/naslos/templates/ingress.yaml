{{- if eq (include "naslos.ingressEnabled" .) "true" }}
---
# Naslos UI IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: naslos-ui
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    # The API and the Authelia portal have their own IngressRoutes
    # (ingress-api.yaml); excluding those prefixes here means this route only
    # ever serves the SPA, without relying on Traefik's rule-length priority.
    - match: Host(`{{ .Values.authelia.domain }}`) && !PathPrefix(`/api`) && !PathPrefix(`/authelia`) && !PathPrefix(`/traefik`)
      kind: Rule
      middlewares:
        - name: forwardauth-authelia
        {{- if eq (include "naslos.authEnabled" .) "true" }}
        # Proves the request came through this proxy: the API rejects owner
        # routes without the shared secret it sets (NAS-001).
        - name: proxy-identity
        {{- end }}
        - name: security-headers
      services:
        - name: naslos-ui
          port: {{ .Values.ui.service.port }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName | default "naslos-tls" }}
---
# HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: naslos-redirect
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.authelia.domain }}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: naslos-ui
          port: {{ .Values.ui.service.port }}
---
# Redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{ .Values.namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
