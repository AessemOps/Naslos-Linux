{{- if .Values.authelia.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: {{ .Values.namespace }}
data:
  configuration.yml: |
    ##################################
    #     Authelia Configuration     #
    ##################################

    theme: dark
    default_redirection_url: https://{{ .Values.authelia.domain }}/
    jwt_secret: {{ randAlphaNum 32 | quote }}
    # Trust the openldap self-signed CA (mounted at /certificates from the
    # naslos-openldap-tls secret via authelia.certificates.existingSecret in
    # values.yaml) for the ldaps:// connection below. Without this, startup
    # fails with "tls: failed to verify certificate: x509: certificate
    # signed by unknown authority".
    certificates_directory: /certificates

    server:
      host: 0.0.0.0
      port: 9091
      path: ""
      # No asset_path: Authelia 4.39 validates the directory exists at
      # startup ("error occurred reading the '/srv/' directory: the
      # directory does not exist") — this image doesn't ship custom
      # assets, so the field is omitted and Authelia serves its bundled
      # default web UI.
      disable_healthcheck: false

    log:
      level: info
      format: text

    totp:
      disable: false
      issuer: {{ .Values.authelia.domain }}
      algorithm: sha1
      digits: 6
      period: 30
      skew: 1

    webauthn:
      disable: false
      display_name: {{ .Values.authelia.domain }}
      attestation_conveyance_preference: indirect
      user_verification: preferred
      timeout: 60s

    duo_api:
      disable: true

    # Password reset is handled by Naslos UI (LDAP password-modify).
    # Disable Authelia's built-in reset to avoid conflicts. In Authelia
    # 4.39 this lives under authentication_backend.password_reset (a
    # top-level "password_reset.disable" key is rejected with
    # "configuration key not expected").
    authentication_backend:
      password_reset:
        disable: true
      ldap:
        implementation: custom
        url: ldaps://{{ .Values.openldap.serviceName | default "naslos-openldap" }}.{{ .Values.namespace }}.svc.cluster.local:636
        timeout: 5s
        start_tls: false
        tls:
          server_name: {{ .Values.openldap.host | default "ldap.naslos.local" }}
          skip_verify: false
          minimum_version: TLS1.2
        base_dn: {{ .Values.openldap.baseDN | default "dc=naslos,dc=local" }}
        username_attribute: uid
        additional_users_dn: ou=people
        # Authelia's LDAP users_filter placeholders are {username_attribute}
        # (replaced with the attribute name above, i.e. "uid") and {input}
        # (the typed username) — NOT the double-brace form. Authelia 4.38+
        # also parses the whole configuration file as a Go template before
        # YAML parsing, so a literal double-brace "input" is interpreted as
        # a template action calling an undefined "input" function, which
        # fatals with a "function not defined" error before the LDAP config
        # is even validated.
        users_filter: (&(objectClass=inetOrgPerson)({username_attribute}={input}))
        additional_groups_dn: ou=groups
        groups_filter: (&(objectClass=groupOfNames)(member={dn}))
        group_name_attribute: cn
        mail_attribute: mail
        display_name_attribute: displayName
        user: {{ .Values.openldap.bindDN | default "cn=naslos-service,ou=services,dc=naslos,dc=local" }}
        password: {{ .Values.openldap.bindPassword | default "CHANGE_ME" | quote }}

    session:
      name: authelia_session
      domain: {{ .Values.authelia.domain }}
      same_site: lax
      expiration: 1h
      inactivity: 5m
      remember_me: 1M
      # No redis block: this is a single-node deployment using the default
      # in-memory session provider. Authelia 4.39 rejects an explicit
      # "session.redis.enabled" key ("configuration key not expected") and,
      # once present, also requires "session.redis.host" — so the whole
      # redis block must be omitted rather than merely disabled.

    # Local SQLite for session storage (single-node)
    storage:
      local:
        path: /config/db.sqlite3

    # Local secrets
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    access_control:
      # Authelia applies the FIRST matching rule, so a rule without `resources`
      # matches the whole domain and silently voids every rule below it. The
      # previous configuration had exactly that (`domain: <host>` + bypass),
      # which meant no request was ever challenged. Keep the bypasses scoped.
      default_policy: deny
      rules:
        # The health probe answers before the proxy is in the path.
        - domain: "*"
          policy: bypass
          resources:
            - "^/api/health$"
        # The buddy peer API authenticates with the peers' own Ed25519 keys (a
        # peer cannot complete an interactive login), so it must not enter the
        # login flow.
        - domain: {{ .Values.authelia.domain | quote }}
          policy: bypass
          resources:
            - "^/api/buddy/v1/"
        # Authelia's own API, for the case where the portal is routed through
        # this same chain. NOTE: routing the portal itself (its page and
        # assets) is a separate decision — see docs/CODE-REVIEW.md CR-01 and
        # the fresh-install plan — so this list deliberately covers the API
        # only and does not pretend to make the portal reachable.
        - domain: {{ .Values.authelia.domain | quote }}
          policy: bypass
          resources:
            - "^/api/(verify|authz|health|state|configuration|firstfactor|secondfactor|reset-password|logout|user/info|consent)(/.*)?$"
        # The admin surface needs a second factor, and these rules must come
        # before the generic one below or they would never match.
        - domain: "*"
          policy: two_factor
          resources:
            - "^/api/users"
            - "^/api/groups"
            - "^/api/apps"
            - "^/api/volumes"
            - "^/api/shares"
        # Everything else the proxy forwards needs at least a session.
        - domain: "*"
          policy: one_factor

    notifier:
      disable_startup_check: false
      filesystem:
        filename: /config/notification.txt

    password_policy:
      standard:
        enabled: true
        min_length: 8
        max_length: 72
        require_uppercase: true
        require_lowercase: true
        require_number: true
        require_special: false
{{- end }}
