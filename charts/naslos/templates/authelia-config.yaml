{{- if .Values.authelia.enabled }}
{{- /*
jwt_secret must be stable across upgrades. `randAlphaNum` alone regenerates it on
every render, which invalidates every session (and rewrites the ConfigMap) on
each `helm upgrade` (AUDIT-M3). Persist it the same way the proxy secret and the
TLS certificate are persisted: generate once, then read the existing Secret back.
*/}}
{{- $jwtSecretName := "naslos-authelia-jwt" }}
{{- $existingJWT := lookup "v1" "Secret" .Release.Namespace $jwtSecretName }}
{{- $jwtSecret := "" }}
{{- if and $existingJWT (index $existingJWT.data "jwt-secret") }}
{{- $jwtSecret = index $existingJWT.data "jwt-secret" | b64dec }}
{{- else }}
{{- $jwtSecret = randAlphaNum 32 }}
{{- end }}
{{- /*
The LDAP service password comes from the naslos-openldap Secret (key
service-password), which openldap/generate-secrets.sh creates and the bootstrap
Job applies to the directory. Reading it here means the credential is not
committed in values and rotation only touches the Secret (AUDIT-H1). The
`bindPassword` value is an escape hatch for `helm template`/dry runs, where
lookup returns nothing; a real install must have the Secret, or a fail message
tells the operator to run generate-secrets.sh first.
*/}}
{{- $ldapSecret := lookup "v1" "Secret" .Release.Namespace "naslos-openldap" }}
{{- $ldapBindPassword := "" }}
{{- if and $ldapSecret (index $ldapSecret.data "service-password") }}
{{- $ldapBindPassword = index $ldapSecret.data "service-password" | b64dec }}
{{- else if .Values.openldap.bindPassword }}
{{- $ldapBindPassword = .Values.openldap.bindPassword }}
{{- else }}
{{- fail "openldap service password unavailable: create the naslos-openldap Secret (openldap/generate-secrets.sh) before installing, or set openldap.bindPassword for a dry run" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jwtSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: authelia
type: Opaque
stringData:
  jwt-secret: {{ $jwtSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: {{ .Release.Namespace }}
data:
  configuration.yml: |
    ##################################
    #     Authelia Configuration     #
    ##################################

    theme: dark
    default_redirection_url: https://{{ .Values.domain }}/
    jwt_secret: {{ $jwtSecret | quote }}
    # Trust the openldap self-signed CA (mounted at /certificates from the
    # naslos-openldap-tls secret via authelia.certificates.existingSecret in
    # values.yaml) for the ldaps:// connection below. Without this, startup
    # fails with "tls: failed to verify certificate: x509: certificate
    # signed by unknown authority".
    certificates_directory: /certificates

    server:
      host: 0.0.0.0
      port: 9091
      # The portal is served at https://<domain>/authelia and Traefik routes
      # that prefix to this service without forwardAuth. Authelia also keeps
      # serving the root path, which is why the forwardAuth address in
      # traefik-middleware.yaml stays /api/authz/forward-auth (the handler
      # listens on both) — see the Authelia docs' subpath guidance.
      path: /authelia
      # No asset_path: Authelia 4.39 validates the directory exists at
      # startup ("error occurred reading the '/srv/' directory: the
      # directory does not exist") — this image doesn't ship custom
      # assets, so the field is omitted and Authelia serves its bundled
      # default web UI.
      disable_healthcheck: false

    log:
      level: info
      format: text

    totp:
      disable: false
      issuer: {{ .Values.domain }}
      algorithm: sha1
      digits: 6
      period: 30
      skew: 1

    webauthn:
      disable: false
      display_name: {{ .Values.domain }}
      attestation_conveyance_preference: indirect
      user_verification: preferred
      timeout: 60s

    duo_api:
      disable: true

    # Password reset is handled by Naslos UI (LDAP password-modify).
    # Disable Authelia's built-in reset to avoid conflicts. In Authelia
    # 4.39 this lives under authentication_backend.password_reset (a
    # top-level "password_reset.disable" key is rejected with
    # "configuration key not expected").
    authentication_backend:
      password_reset:
        disable: true
      ldap:
        implementation: custom
        url: ldaps://{{ .Values.openldap.serviceName | default "naslos-openldap" }}.{{ .Release.Namespace }}.svc.cluster.local:636
        timeout: 5s
        start_tls: false
        tls:
          server_name: {{ .Values.openldap.host | default "ldap.naslos.local" }}
          skip_verify: false
          minimum_version: TLS1.2
        base_dn: {{ .Values.openldap.baseDN | default "dc=naslos,dc=local" }}
        username_attribute: uid
        additional_users_dn: ou=people
        # Authelia's LDAP users_filter placeholders are {username_attribute}
        # (replaced with the attribute name above, i.e. "uid") and {input}
        # (the typed username) — NOT the double-brace form. Authelia 4.38+
        # also parses the whole configuration file as a Go template before
        # YAML parsing, so a literal double-brace "input" is interpreted as
        # a template action calling an undefined "input" function, which
        # fatals with a "function not defined" error before the LDAP config
        # is even validated.
        users_filter: (&(objectClass=inetOrgPerson)({username_attribute}={input}))
        additional_groups_dn: ou=groups
        groups_filter: (&(objectClass=groupOfNames)(member={dn}))
        group_name_attribute: cn
        mail_attribute: mail
        display_name_attribute: displayName
        user: {{ .Values.openldap.bindDN | default "cn=naslos-service,ou=services,dc=naslos,dc=local" }}
        # AUDIT-M3: this is the residual - the LDAP bind password is here rather
        # than in a Secret because the subchart's file-based mechanism
        # (configMap.authentication_backend.ldap.password.secret_name) rendered
        # no password-file env var for this DaemonSet. Revisit when that is
        # understood.
        password: {{ $ldapBindPassword | quote }}

    session:
      name: authelia_session
      domain: {{ .Values.domain }}
      same_site: lax
      expiration: 1h
      inactivity: 5m
      remember_me: 1M
      # No redis block: this is a single-node deployment using the default
      # in-memory session provider. Authelia 4.39 rejects an explicit
      # "session.redis.enabled" key ("configuration key not expected") and,
      # once present, also requires "session.redis.host" — so the whole
      # redis block must be omitted rather than merely disabled.

    # Local SQLite for session storage (single-node)
    storage:
      local:
        path: /config/db.sqlite3

    # Local secrets
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    access_control:
      # Authelia applies the FIRST matching rule, so a rule without `resources`
      # matches the whole domain and silently voids every rule below it. The
      # previous configuration had exactly that (`domain: <host>` + bypass),
      # which meant no request was ever challenged. Keep the bypasses scoped.
      #
      # `domain` must be the real host: a bare `"*"` is not an any-domain
      # matcher in Authelia, so `domain: "*"` rules never match and every
      # request falls through to default_policy deny (403). That is what made
      # /api/health and the admin routes fail while the explicit-domain buddy
      # bypass worked.
      default_policy: deny
      rules:
        # The health probe answers before the proxy is in the path.
        - domain: {{ .Values.domain | quote }}
          policy: bypass
          resources:
            - "^/api/health$"
        # The buddy peer API authenticates with the peers' own Ed25519 keys (a
        # peer cannot complete an interactive login), so it must not enter the
        # login flow.
        - domain: {{ .Values.domain | quote }}
          policy: bypass
          resources:
            - "^/api/buddy/v1/"
        # The portal (page, assets and its own /authelia/api/* XHR calls) is
        # routed to Authelia by its own IngressRoute with no forwardAuth, so it
        # never reaches these rules. The bypass is defensive only.
        - domain: {{ .Values.domain | quote }}
          policy: bypass
          resources:
            - "^/authelia(/.*)?$"
        # Administrators must present a second factor on every path, not only on
        # the admin API prefixes. Matching by subject is what makes the portal
        # prompt TOTP/WebAuthn enrolment during the first login: with only the
        # API prefixes marked two_factor, the SPA itself opened on a one-factor
        # session and its admin calls bounced to the portal, which the page
        # showed as "Failed to connect to API" instead of a 2FA prompt.
        #
        # Any other authenticated account stays one_factor; the API's
        # RequireAdmin group check still gates it (CR-03).
        - domain: {{ .Values.domain | quote }}
          subject:
            - "group:naslos_admins"
          policy: two_factor
        # The Traefik dashboard exposes every router, service and middleware, so
        # it is operator-only. Admins already matched the subject rule above
        # (with 2FA); a non-admin account is denied outright rather than being
        # let in on one_factor. First match wins, so an account in both groups
        # is still allowed by the rule above.
        - domain: {{ .Values.domain | quote }}
          subject:
            - "group:naslos_users"
          policy: deny
          resources:
            - "^/traefik"
        # Everything else the proxy forwards needs at least a session.
        - domain: {{ .Values.domain | quote }}
          policy: one_factor

    notifier:
      disable_startup_check: false
      filesystem:
        filename: /config/notification.txt

    # Registering the first second-factor device is a "credential management"
    # action, so Authelia requires an elevated session whose one-time code is
    # delivered by the notifier above. There is no mail relay here, so the code
    # is only written to /config/notification.txt: the operator has to read it
    # out for the one-time enrolment, hence the generous lifespan.
    identity_validation:
      elevated_session:
        code_lifespan: '1 hour'
        elevation_lifespan: '30 minutes'
        characters: 8
        # Once an operator has a second factor, managing credentials needs only
        # that factor — not another notifier code.
        skip_second_factor: true

    password_policy:
      standard:
        enabled: true
        min_length: 8
        max_length: 72
        require_uppercase: true
        require_lowercase: true
        require_number: true
        require_special: false
{{- end }}
