{{- /*
TLS material for the naslos-vmd <-> naslos-api channel (the PF-M5 agent
pattern, applied to the QEMU supervisor).

vmd is a privileged, hostNetwork pod, so a NetworkPolicy cannot protect it
and the shared bearer token would otherwise cross the LAN in cleartext. This
template generates a CA and a server certificate for the vmd Service:

  <name>      in the workload namespace: ca.crt + tls.crt + tls.key for vmd
  <name>-ca   in the release namespace: ca.crt only, for the API to pin

Two Secrets are needed because a pod may only mount a Secret in its own
namespace. Like agent-tls-secret.yaml it generates once and then reuses via
`lookup`, so the material does not rotate across upgrades; `helm template`
and `--dry-run` have no cluster to look up and render a fresh certificate each
time, which is expected.
*/}}
{{- if and .Values.virt.enabled .Values.virt.tls.enabled }}
{{- $ns := include "naslos.workloadNamespace" . }}
{{- $apiNS := .Release.Namespace }}
{{- $name := .Values.virt.tls.secretName | default "naslos-vmd-tls" }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $caB64 := "" }}
{{- $certB64 := "" }}
{{- $keyB64 := "" }}
{{- if $existing }}
{{- $caB64 = index $existing.data "ca.crt" | default "" }}
{{- $certB64 = index $existing.data "tls.crt" | default "" }}
{{- $keyB64 = index $existing.data "tls.key" | default "" }}
{{- end }}
{{- if not (and $caB64 $certB64 $keyB64) }}
{{- $ca := genCA "naslos-vmd-ca" 3650 }}
{{- $dns := list "naslos-vmd" (printf "naslos-vmd.%s" $ns) (printf "naslos-vmd.%s.svc" $ns) (printf "naslos-vmd.%s.svc.cluster.local" $ns) }}
{{- $cert := genSignedCert "naslos-vmd" (list) $dns 3650 $ca }}
{{- $caB64 = $ca.Cert | b64enc }}
{{- $certB64 = $cert.Cert | b64enc }}
{{- $keyB64 = $cert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: naslos-vmd
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.crt: {{ $caB64 }}
  tls.crt: {{ $certB64 }}
  tls.key: {{ $keyB64 }}
---
# The API pins the vmd certificate against this CA. A pod can only mount a
# Secret from its own namespace, so the CA is also emitted in the release
# namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ca
  namespace: {{ $apiNS }}
  labels:
    app.kubernetes.io/name: naslos-vmd
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.crt: {{ $caB64 }}
{{- end }}
