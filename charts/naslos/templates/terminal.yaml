# Web terminal: the privileged container the browser gets a shell in.
#
# Talos has no host shell by design, so FR-LOG-02 asks for exactly this: a
# privileged container with the host mounted, whose shell can inspect and repair
# the node (zpool/zfs directly or via `chroot /host`). It runs no service - the
# API execs into it over the Kubernetes API, so it is idle when nobody is using
# the terminal.
#
# Security: this container is root and privileged by necessity. It is reachable
# only through the API's exec endpoint, which the chart scopes to this namespace;
# the API's owner gate (proxy secret + admin identity) is the boundary, and the
# only listener is the Authelia-protected proxy - see docs/terminal.md.
{{- if and .Values.ui.enabled .Values.terminal.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-terminal
  namespace: {{ include "naslos.workloadNamespace" . }}
  labels:
    app.kubernetes.io/name: naslos-terminal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naslos-terminal
  namespace: {{ include "naslos.workloadNamespace" . }}
  labels:
    app.kubernetes.io/name: naslos-terminal
    app.kubernetes.io/component: terminal
spec:
  replicas: 1
  # A single shared shell container: exec sessions attach to it, so it must not
  # be replaced while someone is working in it. Chart upgrades recreate it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-terminal
        app.kubernetes.io/component: terminal
    spec:
      serviceAccountName: naslos-terminal
      # The shell must survive between exec sessions, so the container idles.
      containers:
        - name: shell
          image: {{ include "naslos.image" .Values.terminal.image }}
          imagePullPolicy: {{ .Values.terminal.image.pullPolicy }}
          command: ["sleep", "infinity"]
          stdin: true
          tty: true
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            # The Talos host filesystem: /host/usr/local/sbin/zpool, /etc, logs.
            - name: host
              mountPath: /host
              mountPropagation: HostToContainer
            # The ZFS datasets, for inspecting share content directly.
            - name: datasets
              mountPath: /var/mnt
              mountPropagation: HostToContainer
            # Device nodes: /dev/zfs for the ZFS tooling, the disks themselves.
            - name: dev
              mountPath: /dev
          resources:
            {{- toYaml .Values.terminal.resources | nindent 12 }}
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: datasets
          hostPath:
            path: /var/mnt
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
            type: Directory
---
# The API execs into pods and reads their logs (AUDIT-M6: the terminal now lives
# in the privileged namespace, so the Role is granted THERE, not in the release
# namespace). Scoped with a namespaced Role rather than a ClusterRole: the API
# has no business exec-ing into anything outside the Naslos namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: naslos-api-terminal
  namespace: {{ include "naslos.workloadNamespace" . }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: naslos-api-terminal
  namespace: {{ include "naslos.workloadNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: naslos-api-terminal
subjects:
  - kind: ServiceAccount
    name: naslos-api
    namespace: {{ .Release.Namespace }}
---
# Namespaces are cluster-scoped, so the picker needs one narrow ClusterRole (a
# Role cannot grant them). Read-only, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naslos-api-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: naslos-api-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: naslos-api-namespaces
subjects:
  - kind: ServiceAccount
    name: naslos-api
    namespace: {{ .Release.Namespace }}
{{- /*
The terminal paths (/api/pods, /api/namespaces, /api/ws/*) are served by the
naslos-api IngressRoute in ingress-api.yaml, which routes all of /api straight
to the API behind forwardAuth + proxy-identity — exactly what this dedicated
route used to do, and why the UI's nginx (which refuses those paths) is out of
the authenticated data path. Keeping one route avoids two places to update when
the middlewares or the TLS secret name change.
*/}}
{{- end }}
