{{- /*
Explicit TLS policy for the platform routes (SEC-2026-F9). Traefik defaults are
already TLS 1.2+, but pinning the minimum, curves and TLS 1.2 ciphers makes the
policy reviewable and survives a Traefik default change. The option lives in the
release namespace with the platform IngressRoutes; app routes keep the provider
defaults (a TLSOption is namespace-scoped).
*/}}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: naslos-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos
spec:
  minVersion: VersionTLS12
  sniStrict: true
  curvePreferences:
    - X25519
    - CurveP256
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
