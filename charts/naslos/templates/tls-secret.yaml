{{- /*
TLS certificate for the IngressRoutes.

The chart owns a self-signed certificate for `authelia.domain` so the proxy
posture works with no out-of-band step. It is generated once and then reused:
`lookup` reads the existing Secret on every upgrade and re-emits its bytes, so
the certificate does not rotate (and browsers do not have to be re-taught it).

Set `ingress.tls.existingSecret` to use a Secret you manage instead (for
example a real CA certificate); this template then renders nothing.

Caveat: `helm template` and `--dry-run` have no cluster to look up, so they
render a freshly generated certificate each time. That is expected; only a
real install/upgrade persists one.

The certificate is valid for ~10 years. To force a renewal, delete the Secret
and run the upgrade again.
*/}}
{{- if eq (include "naslos.ingressEnabled" .) "true" }}
{{- if not .Values.ingress.tls.existingSecret }}
{{- $name := .Values.ingress.tls.secretName | default "naslos-tls" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingCert := "" }}
{{- $existingKey := "" }}
{{- if $existing }}
{{- $existingCert = index $existing.data "tls.crt" | default "" }}
{{- $existingKey = index $existing.data "tls.key" | default "" }}
{{- end }}
{{- if and $existingCert $existingKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  tls.crt: {{ $existingCert | quote }}
  tls.key: {{ $existingKey | quote }}
{{- else }}
{{- $ca := genCA "naslos-local-ca" 3650 }}
{{- $cert := genSignedCert .Values.authelia.domain (list) (list .Values.authelia.domain) 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: naslos
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
{{ $cert.Cert | indent 4 }}
  tls.key: |
{{ $cert.Key | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
