# Naslos Helm chart values

# API server configuration
api:
  enabled: true
  image:
    repository: 192.168.1.2:30095/naslos-api
    tag: "0.1.0-r9"
    # Pin the exact image (NAS-022). A tag is mutable, so a retag plus
    # pullPolicy: IfNotPresent can keep running old code; repo@sha256:… is
    # immutable. Set it from `docker inspect --format='{{index .RepoDigests 0}}'`
    # or `make image-digests`. Empty means "use the tag".
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
  # Startup ordering guard: wait briefly for OpenLDAP before starting the API
  # so a cold start (both pods restarting together) does not serve identity
  # errors. Best-effort only — the API starts anyway if LDAP is down, because
  # the identity client reconnects lazily on its own.
  waitForLdap:
    retries: 10
    intervalSeconds: 1
  # Name of a Secret (key "talosconfig") containing a talosconfig file with
  # its `endpoints:` list populated. Mounted into the pod and referenced via
  # the TALOSCONFIG env var — the talos machinery client library resolves its
  # config from that env var (NOT a "TALOS_ENDPOINTS" var, which it never
  # reads). Empty disables the mount/env (and thus node management) — set
  # per environment, e.g. "naslos-talosconfig" for the single-node VM (see
  # values-vm.yaml).
  talosConfigSecret: ""
  # Base URL of the naslos-agent Service for ZFS pool operations
  # (see templates/agent-daemonset.yaml headless Service). Empty selects the
  # in-namespace default http://naslos-agent.<namespace>.svc.cluster.local:9090.
  agentBaseURL: ""
  # Read-only hostPath to the ZFS datasets, mounted at /var/mnt so the API can
  # list and validate share paths for the shares UI. Set to "null"/empty on
  # multi-node clusters (a hostPath pins the pod to one node and would list
  # only that node's datasets).
  datasetsHostPath: /var/mnt
  # Share definitions are persisted to SHARES_CONFIG so they survive API pod
  # restarts and chart upgrades. Without a mounted path the share manager is
  # in-memory only and every share is lost on restart.
  sharesConfig:
    enabled: true
    # Path inside the API container (mounted from a PVC).
    mountPath: /var/lib/naslos
    file: /var/lib/naslos/shares.json
    # Size of the PersistentVolumeClaim holding SHARES_CONFIG.
    size: 64Mi
    storageClassName: ""
  # Where notification settings (topic, token, enabled events, severity) are
  # persisted. They share the volume above, so they survive API restarts; with no
  # writable path the notification manager is memory-only and every restart
  # resets the configuration.
  notificationsFile: /var/lib/naslos/notifications.json
  # LDAP CA certificate Secret (key ca.crt) used to verify the OpenLDAP TLS
  # certificate. The API mounts it and sets LDAP_CA_CERT. Defaults to the
  # secret created by openldap/generate-secrets.sh.
  ldapCA:
    secretName: naslos-openldap-tls
    key: ca.crt
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# UI configuration
ui:
  enabled: true
  image:
    repository: 192.168.1.2:30095/naslos-ui
    tag: "0.1.0-r10"
    # Pin the exact image (NAS-022). A tag is mutable, so a retag plus
    # pullPolicy: IfNotPresent can keep running old code; repo@sha256:… is
    # immutable. Set it from `docker inspect --format='{{index .RepoDigests 0}}'`
    # or `make image-digests`. Empty means "use the tag".
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  # Startup guard: nginx resolves the API host name at startup and refuses to
  # boot if it is not in DNS yet, which is the case right after a node reboot
  # (the UI comes up before the API Service). The UI pod waits for the name -
  # bounded - so it starts on the first attempt instead of crash-looping.
  waitForApi:
    retries: 30
    intervalSeconds: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Agent DaemonSet configuration
agent:
  enabled: true
  image:
    repository: 192.168.1.2:30095/naslos-agent
    tag: "0.1.0-r4"
    # Pin the exact image (NAS-022). A tag is mutable, so a retag plus
    # pullPolicy: IfNotPresent can keep running old code; repo@sha256:… is
    # immutable. Set it from `docker inspect --format='{{index .RepoDigests 0}}'`
    # or `make image-digests`. Empty means "use the tag".
    digest: ""
    pullPolicy: IfNotPresent
  # Privileged is required for chroot /host zpool/zfs operations
  privileged: true
  # Use a Secret you manage out of band for the agent bearer token; it must have
  # a `token` key. Empty means the chart generates `naslos-agent`/`token`.
  tokenSecret: ""
  # Headless Service fronting the agent pods (port 9090). naslos-api dials
  # this DNS name for ZFS operations; ClusterIP must stay None so multi-node
  # clusters resolve one A record per agent pod.
  service:
    port: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ZFS configuration
zfs:
  enabled: true
  # ARC max size in bytes (0 = auto-detect based on system memory)
  arcMax: 0
  # Auto-import pools at boot (handled by zfs-service extension)
  autoImport: true

# Shares configuration.
#
# Share definitions live in the API (persisted on a PVC) and are rendered into
# smb.conf / exports, which the privileged naslos-agent writes to the host at
# /var/lib/naslos/shares. Dedicated serving workloads mount that directory and
# reload themselves when the rendered config changes.
shares:
  enabled: true
  smb:
    enabled: true
    workgroup: "NASLOS"
    # Time Machine support for macOS (SMB + fruit VFS; AFP is deprecated)
    timeMachine: true
    image:
      repository: 192.168.1.2:30095/naslos-samba
      tag: "0.1.0-r3"
      # Pin the exact image (NAS-022). A tag is mutable, so a retag plus
      # pullPolicy: IfNotPresent can keep running old code; repo@sha256:… is
      # immutable. Set it from `docker inspect --format='{{index .RepoDigests 0}}'`
      # or `make image-digests`. Empty means "use the tag".
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # Advertise the server on the network so it appears when a client browses
  # SMB (Dolphin/Finder use mDNS, Windows Explorer uses WSD) instead of having
  # to type the address. `name` is also used as the Samba NetBIOS name, so
  # clients see one identity.
  discovery:
    enabled: true
    name: "naslos"
    # Interface to advertise on. Empty auto-detects the default-route
    # interface, which keeps the advertisement off the pod network
    # (cni0/flannel/veth) so clients do not see a 10.x address.
    interface: ""
  # How often the samba container re-checks the rendered config and account
  # file, in seconds. This bounds how long a password change takes to apply to
  # NEW SMB connections (existing sessions keep their credentials until they
  # reconnect), so lowering it converges faster at the cost of more polling.
  confCheckInterval: 3
  nfs:
    enabled: true
    image:
      repository: 192.168.1.2:30095/naslos-nfs
      tag: "0.1.0-r3"
      # Pin the exact image (NAS-022). A tag is mutable, so a retag plus
      # pullPolicy: IfNotPresent can keep running old code; repo@sha256:… is
      # immutable. Set it from `docker inspect --format='{{index .RepoDigests 0}}'`
      # or `make image-digests`. Empty means "use the tag".
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # AFP is deprecated in favour of SMB Time Machine and is not served.
  afp:
    enabled: false

# Traefik ingress controller
# Traefik chart v39+ requires the new ports schema:
#   expose is an object with nested http level, not a boolean.
# The chart is wired into naslos via the `condition: traefik.enabled` in
# Chart.yaml (there is no `enabled:` key in the traefik subchart's schema).
traefik:
  ports:
    web:
      port: 80
      expose:
        default: true
    websecure:
      port: 443
      expose:
        default: true
  service:
    type: LoadBalancer
  # Traefik's own dashboard, served under https://<domain>/traefik by the
  # naslos-traefik-dashboard IngressRoute (ingress-api.yaml). `api.insecure`
  # stays false, so the API is only reachable through that route, and basePath
  # is what makes the dashboard frontend call /traefik/api/* instead of /api/*
  # (which the Naslos API owns).
  api:
    dashboard: true
    basePath: /traefik
  # hostPort 80/443 can only be held by one pod on this single node, so the
  # chart default (maxSurge 1, maxUnavailable 0) deadlocks: the new pod never
  # becomes Ready because the old one still owns the ports. terminate the old
  # pod first; the proxy is briefly unavailable during an upgrade.
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Traefik 41 renamed the logging key from `logs` to `log`; its chart schema
  # rejects the old one.
  log:
    general:
      level: INFO

# Public hostname the appliance answers on: the ingress Host match, the Authelia
# session cookie domain, the TOTP issuer/WebAuthn display name and the TLS SAN.
# It cannot live under `authelia:` — the Authelia 0.11.22 chart schema rejects
# unknown keys there (the 0.10 keys `domain`/`server` are gone).
domain: naslos.local

# Authelia authentication
authelia:
  enabled: true
  configMap:
    # Use our own ConfigMap (charts/naslos/templates/authelia-config.yaml,
    # wired up with the LDAP backend) instead of the authelia subchart's
    # generated one. The subchart only understands `configMap.existingConfigMap`
    # / `configMap.key` / `configMap.disabled` — NOT `configMap.enabled`/`name`.
    existingConfigMap: authelia-config
    key: configuration.yml
  # Trust the openldap self-signed CA for the ldaps:// connection — the
  # secret (created by openldap/generate-secrets.sh) already has a ca.crt
  # key; the authelia chart mounts every key of this secret at /certificates
  # and trusts them as additional CAs.
  certificates:
    existingSecret: naslos-openldap-tls
  # Persist Authelia's SQLite session/storage DB — without this, /config
  # doesn't exist and Authelia fatals at startup with "unable to open
  # database file: no such file or directory".
  persistence:
    enabled: true
  # SMTP not required - password resets handled by LDAP/UI
  # Session storage uses local SQLite for single-node
  # LDAP backend configured in templates/authelia-config.yaml

# Notifications (ntfy) — sent by the Naslos API. No bundled ntfy chart: the
# previous repository https://helm.ntfy.sh/ no longer resolves (DNS failure) so
# the dependency was dropped from Chart.yaml. The API sends to the public
# ntfy.sh server (empty URL) or any self-hosted ntfy server.
ntfy:
  enabled: true
  server:
    url: ""  # Empty = use https://ntfy.sh (public)
    topic: "naslos-alerts"

# Monitoring
prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      retention: 30d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi

# Grafana is disabled for now: it is not part of the current surface, and the
# static admin password it shipped with was a finding (AUDIT-H4). Enabling it
# again needs a credential from a Secret, never a literal here.
grafana:
  enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: naslos
          orgId: 1
          folder: Naslos
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/naslos
  dashboards:
    naslos:
      naslos-overview:
        json: |
          {"title": "Naslos Overview", "uid": "naslos-home"}

# Storage classes
storage:
  # Local path provisioner for app data
  localPath:
    enabled: true
    path: /var/mnt/local-path-provisioner
  # No zfsLocalPV block: no template consumed it, the ZFS LocalPV provisioner
  # is not installed, and its pool name did not exist on the node (AUDIT-M13).
  # Every volume binds through local-path above. Add the provisioner first if
  # ZFS-backed PVCs are ever wanted.

# OpenLDAP configuration
openldap:
  enabled: true
  serviceName: naslos-openldap
  # Custom Naslos OpenLDAP image (in the chart authelia only needs host/baseDN;
  # deploy-vm.sh overrides this for the standalone manifests).
  # A full image reference, so a digest can be pinned directly here:
  #   192.168.1.2:30095/naslos-openldap@sha256:<digest>
  # Used by the API's wait-for-ldap init container. Keep it in step with the
  # tag the openldap manifests deploy.
  image: 192.168.1.2:30095/naslos-openldap:0.1.0-r4
  host: ldap.naslos.local
  baseDN: "dc=naslos,dc=local"
  bindDN: "cn=naslos-service,ou=services,dc=naslos,dc=local"
  # Leave empty: the chart reads the password from the naslos-openldap Secret
  # (key service-password), so no credential is committed. Set it only for a
  # dry run where `helm template` has no cluster to look the Secret up in
  # (AUDIT-H1). Never commit a real value here.
  bindPassword: ""

# No `namespace` value: every template uses `.Release.Namespace`, so the chart
# installs under any release namespace (`helm -n <ns>`), which is what multi-
# release installs need (AUDIT-L9). The namespace object is still created, under
# the release namespace.

# Internal authentication between components (NAS-001/NAS-002).
#
# Every owner-facing API route requires the shared secret that Traefik's
# `proxy-identity` middleware injects (Secret `naslos-proxy`, key `secret`), and
# the privileged agent requires a bearer token (Secret `naslos-agent`, key
# `token`). Both are generated once at install and preserved across upgrades.
#
# There is deliberately no `disabled` switch: the API and agent refuse to start
# without their credential, and every request is authenticated.
auth:
  # Supply this value verbatim instead of generating one (dry runs only).
  # Never commit a value here: prefer the generated Secret or proxySecretName.
  proxySecret: ""
  # Authorize with a Secret you manage out of band. It must have a `secret` key;
  # the Traefik middleware reads it through lookup, so upgrades resolve it
  # against the cluster.
  proxySecretName: ""
  # Networks allowed to present the identity headers (defense in depth: the
  # secret above is the actual proof).
  traefikCIDR: 10.0.0.0/8

# Traefik IngressRoute + middlewares (Authelia forwardAuth, security headers and
# the proxy-identity secret). Gated on this flag rather than `traefik.enabled`:
# that key is the subchart dependency's condition, and the Traefik subchart's
# values schema rejects it ("additional properties 'enabled' not allowed"), so
# `.Values.traefik.enabled` can never be true and the templates would never
# render. The subchart itself installs regardless (a missing condition value
# means "enabled"); these objects are what put the API behind the authenticating
# proxy. This is the only listener: there is no NodePort or any other
# unauthenticated path, so a release installed without ingress has no way in.
# charts/naslos/values-vm.yaml is the reference profile (it enables ingress).
ingress:
  enabled: false
  # The Authelia Service that the forwardAuth middleware and the portal
  # IngressRoute point at. The subchart names it <release>-authelia (release
  # `naslos` -> `naslos-authelia`) and exposes port 80, targeting the
  # container's 9091. Override the name if you install the release under a
  # different name.
  authelia:
    serviceName: naslos-authelia
    port: 80
  # TLS for the IngressRoutes. Leave existingSecret empty to let the chart
  # generate a self-signed certificate for the `domain` value once and reuse it
  # across upgrades (templates/tls-secret.yaml); point it at a Secret you manage
  # (keys tls.crt/tls.key) to serve a real CA certificate instead.
  tls:
    secretName: naslos-tls
    existingSecret: ""

# Web terminal (spec FR-LOG-02). `enabled` controls the privileged shell
# container and the API's exec RBAC together: with it off, /api/ws/exec has no
# target and the terminal page reports that the terminal is disabled.
terminal:
  enabled: true
  # The terminal's endpoints are owner routes like any other, so they are gated
  # by `auth` above (previously a separate terminal.requireAuth switch).
  # digest (NAS-022): pin the exact image; empty means "use the tag".
  image: { repository: 192.168.1.2:30095/naslos-terminal, tag: "0.1.0-r3", digest: "" }
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Buddy Backup (docs/buddy-backup.md): a key-authenticated API that lets another
# Naslos instance - or the standalone naslos-buddy-receiver container - push
# incremental ZFS backups to this one. Everything arrives already encrypted with
# a key only the sender holds, so this instance stores bytes it cannot read.
buddy:
  # Serve /api/buddy/v1/* on this instance. Peers reach it the same way the UI
  # does: through the ingress, via /api/buddy/v1/ (Authelia bypasses that prefix;
  # peers authenticate with their own keys). Enabling it needs receiveHostPath,
  # so leave this off until the dataset exists.
  enabled: false
  # Name this instance reports to peers ("naslos-a", "backup-nas").
  name: naslos
  # Host path of the dataset that stores received chunks. Create it first:
  #   zfs create naslos-pool/naslos-buddy
  # On the VM layout that is /var/mnt/naslos-pool/naslos-buddy. It is mounted
  # read-write into the API because that is the one thing a receiver may write,
  # and only ciphertext can ever land there.
  receiveHostPath: ""
  # Where the chunks are mounted inside the API pod.
  receivePath: /var/lib/naslos/buddy
  # The authorized-keys registry, kept with the other Naslos state files.
  peersFile: /var/lib/naslos/buddy-peers.json
  # Scheduled backups (docs/buddy-backup.md): where the schedule entries live and
  # how often the runner checks for due ones. Defaults match the API's.
  schedulesFile: /var/lib/naslos/buddy-schedules.json
  schedulerIntervalMs: 60000
  # A one-time token that lets a peer authorize its own key (buddyctl enroll).
  # Empty means every key must be authorized explicitly. Either set it in values
  # (rendered into the naslos-buddy Secret) or point enrollTokenSecret at a
  # Secret you created out of band with kubectl.
  enrollToken: ""
  enrollTokenSecret: ""
  # Authorizing or revoking peers hands out storage access, so those routes go
  # through the owner gate like everything else (the `auth` section above).
