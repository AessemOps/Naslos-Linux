apiVersion: v2
name: naslos
description: Naslos - A user-friendly NAS distribution for Talos Linux
type: application
version: 0.1.2
appVersion: "0.1.2"
keywords:
  - nas
  - talos
  - zfs
  - storage
  - smb
  - nfs
home: https://github.com/AessemOps/Naslos-Linux
sources:
  - https://github.com/AessemOps/Naslos-Linux
maintainers:
  - name: Naslos Team
    email: team@naslos.dev
dependencies:
  - name: traefik
    version: "41.6.0"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  - name: authelia
    version: "0.11.22"
    repository: https://charts.authelia.com
    condition: authelia.enabled
  # ntfy chart dependency intentionally omitted: the previous repository
  # https://helm.ntfy.sh/ is no longer resolvable (DNS failure), and it broke
  # `helm dependency update` with a bogus "no cached repository for
  # helm-manager-<hash>" error. Notifications still work: the Naslos API sends
  # to the public ntfy.sh server (api ServerURL default) or any self-hosted
  # ntfy server you configure.
  # Prometheus/Alertmanager intentionally NOT a dependency (removed 2026-10-04):
  # the stack cost ~265 MiB of resident memory on the single-node appliance and
  # nothing consumed its data. The dashboard reads the API's own /api/metrics
  # aggregator (api/internal/metrics), which is independent of Prometheus. See
  # docs/monitoring.md.
  # Optional: the SSL page renders cert-manager Issuer/Certificate CRs and
  # gates on the CRDs being installed. Enabling this subchart installs
  # cert-manager itself; the CRDs come from `make crds` either way.
  - name: cert-manager
    version: "v1.18.2"
    repository: https://charts.jetstack.io
    condition: certManager.enabled
