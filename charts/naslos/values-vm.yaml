# Naslos Helm values override for the single-node VM (192.168.1.117).
# Usage:
#   make install-vm
# or manually:
#   helm upgrade --install naslos charts/naslos -n naslos --create-namespace \
#     -f charts/naslos/values.yaml -f charts/naslos/values-vm.yaml

# Registry default for the VM deployment (private HTTP registry).
# scripts/deploy-vm.sh passes explicit --set overrides as well, so these
# values mainly serve direct `make install-vm` / `helm` invocations.

# Internal auth is OFF on the VM: the UI is reached over its NodePort and there
# is no Traefik/Authelia in front of it, so the proxy secret that the API
# requires on every owner route would never be injected. This is a
# development-only posture - the NodePort reaches every API route, including the
# terminal, unauthenticated. Never use these values on a reachable instance.
# The proxy-protected posture (auth.disabled=false + ingress.enabled=true) needs
# pieces that do not exist yet — Authelia portal routing, the `naslos-tls`
# secret, Traefik LAN exposure, an LDAP operator account and peer-API bypass —
# see `docs/CODE-REVIEW.md` CR-01 and the fresh-install plan.
auth:
  disabled: true

# The tags below are the ones actually deployed on the VM. `scripts/deploy-vm.sh`
# overrides them with its IMAGE_TAG at install time, but a bare `make install-vm`
# or `make install-prod` uses these — leaving them at a tag that does not exist
# is what produced ErrImagePull on the samba/nfs/terminal DaemonSets (the
# registry has no plain `0.1.0` for those, only for api/agent/ui/openldap, which
# would silently roll the API back to old code).
api:
  image:
    repository: 192.168.1.2:30095/naslos-api
    tag: "0.1.0-r3"
  # The API manages the node via the Talos API; without this it crashes at
  # startup with "Failed to create Talos client: failed to determine
  # endpoints". Create the secret first:
  #   kubectl create secret generic naslos-talosconfig -n naslos \
  #     --from-file=talosconfig=bootstrap/vm/talosconfig-pod
  # (talosconfig-pod is the talosconfig with a real `endpoints:` entry —
  # the CLI talosconfig generated by `make bootstrap-vm` has an empty list
  # since endpoints are normally passed via --endpoints on the CLI).
  talosConfigSecret: "naslos-talosconfig"
  # LDAP CA certificate for the API; the chart default is fine for the VM
  # because naslos-openldap-tls is created by generate-secrets.sh.
  # ldapCA:
  #   secretName: naslos-openldap-tls
  #   key: ca.crt
agent:
  image:
    repository: 192.168.1.2:30095/naslos-agent
    tag: "0.1.0-r2"
ui:
  image:
    repository: 192.168.1.2:30095/naslos-ui
    tag: "0.1.0-r4"
  # Expose the UI directly via NodePort on 192.168.1.117:30080.
  # Traefik is still installed but the IngressRoute expects the authelia.domain,
  # which is the VM IP; browsers can reach the NodePort without a LoadBalancer.
  nodePort:
    enabled: true
    port: 30080
# Share services (SMB + NFS) for the single-node VM.
shares:
  smb:
    image:
      repository: 192.168.1.2:30095/naslos-samba
      tag: "0.1.0-r1"
  nfs:
    image:
      repository: 192.168.1.2:30095/naslos-nfs
      tag: "0.1.0-r1"
terminal:
  image:
    repository: 192.168.1.2:30095/naslos-terminal
    tag: "0.1.0-r1"
openldap:
  image: 192.168.1.2:30095/naslos-openldap:0.1.0-r1
  # OpenLDAP host is the service name for internal cluster references.
  host: naslos-openldap
  # Must match the naslos-openldap secret's "service-password" key (set by
  # openldap/generate-secrets.sh, default SERVICE_PASSWORD env var) — this
  # is what the naslos-openldap-bootstrap Job writes as the naslos-service
  # account's real userPassword. If they don't match, Authelia's LDAP bind
  # fails at startup with "LDAP Result Code 49 \"Invalid Credentials\"".
  # Override SERVICE_PASSWORD when running generate-secrets.sh and update
  # this value (or pass --set openldap.bindPassword=... at install time) to
  # keep them in sync.
  bindPassword: "CHANGE_ME_SERVICE_PASSWORD"

# Use the VM IP as the Authelia domain (self-signed TLS). Only meaningful once
# the ingress path exists; see the header note.
authelia:
  domain: 192.168.1.117

# Traefik: keep it enabled but use ClusterIP by default on the VM.
# If your VM environment provides a LoadBalancer (e.g. MetalLB), set
# traefik.service.type back to LoadBalancer.
traefik:
  service:
    type: ClusterIP

# Grafana admin password — change in production.
grafana:
  adminPassword: naslos-admin
