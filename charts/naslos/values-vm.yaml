# Naslos Helm values for the single-node VM (192.168.1.117).
#
# This is the production posture: Traefik on the node's 80/443 with Authelia
# forwardAuth, the portal at https://naslos.local/authelia, and no
# unauthenticated listener anywhere. There is no dev/NodePort profile.
#
# Usage:
#   make install-vm
# or manually:
#   helm upgrade --install naslos charts/naslos -n naslos --create-namespace \
#     -f charts/naslos/values.yaml -f charts/naslos/values-vm.yaml

# Registry default for the VM deployment (private HTTP registry).
# scripts/deploy-vm.sh passes explicit --set overrides as well, so these
# values mainly serve direct `make install-vm` / `helm` invocations.

# The tags below are the ones actually deployed on the VM. `scripts/deploy-vm.sh`
# overrides them with its IMAGE_TAG at install time, but a bare `make install-vm`
# uses these — leaving them at a tag that does not exist is what produced
# ErrImagePull on the samba/nfs/terminal DaemonSets (the registry has no plain
# `0.1.0` for those, only for api/agent/ui/openldap, which would silently roll
# the API back to old code).
api:
  image:
    repository: 192.168.1.2:30095/naslos-api
    tag: "0.1.0-r30"
  # The API manages the node via the Talos API; without this it crashes at
  # startup with "Failed to create Talos client: failed to determine
  # endpoints". Create the secret first:
  #   kubectl create secret generic naslos-talosconfig -n naslos \
  #     --from-file=talosconfig=bootstrap/vm/talosconfig-pod
  # (talosconfig-pod is the talosconfig with a real `endpoints:` entry —
  # the CLI talosconfig generated by `make bootstrap-vm` has an empty list
  # since endpoints are normally passed via --endpoints on the CLI).
  talosConfigSecret: "naslos-talosconfig"
  # LDAP CA certificate for the API; the chart default is fine for the VM
  # because naslos-openldap-tls is created by generate-secrets.sh.
  # ldapCA:
  #   secretName: naslos-openldap-tls
  #   key: ca.crt
agent:
  image:
    repository: 192.168.1.2:30095/naslos-agent
    tag: "0.1.0-r8"
ui:
  image:
    repository: 192.168.1.2:30095/naslos-ui
    tag: "0.1.0-r23"
# Share services (SMB + NFS) for the single-node VM.
shares:
  smb:
    image:
      repository: 192.168.1.2:30095/naslos-samba
      tag: "0.1.0-r3"
  nfs:
    image:
      repository: 192.168.1.2:30095/naslos-nfs
      # r3 = Debian 13 / Ganesha 6.5. It needs CAP_SYS_RESOURCE for
      # PR_SET_IO_FLUSHER (added in nfs-daemonset.yaml); with that, Ganesha 6.5
      # starts with the same rendered ganesha.conf as 4.x.
      tag: "0.1.0-r3"
terminal:
  image:
    repository: 192.168.1.2:30095/naslos-terminal
    tag: "0.1.0-r3"
openldap:
  # r5 = Debian 13 / slapd 2.6.10, with /var/run/slapd created in the image
  # (Debian 13's slapd needs it for its pid file; tmpfiles.d never runs in a
  # container) and LDAPS-only listening (LDAP_TLS_ENFORCE; no plaintext
  # ldap:///). r4 was the previous tag.
  image: 192.168.1.2:30095/naslos-openldap:0.1.0-r5
  # OpenLDAP host is the service name for internal cluster references.
  host: naslos-openldap
  # No bindPassword here. The chart reads the service password from the
  # naslos-openldap Secret (key service-password), which
  # openldap/generate-secrets.sh creates and the naslos-openldap-bootstrap Job
  # applies to the directory; rotating it is a Secret patch plus a bootstrap
  # re-run, and nothing lands in git (AUDIT-H1).

# The public name: session cookie domain, TOTP issuer and TLS SAN. It resolves
# through the mDNS record the Samba container advertises; add a router A record
# (naslos.local -> the VM IP) for clients without mDNS (Windows).
domain: naslos.local

# App install subsystem: the official chart repository is the NaslosCharts git
# repo, cloned over SSH with a deploy key held in a Secret (create it with
# `kubectl -n naslos create secret generic naslos-charts-deploy-key
#  --from-file=ssh-private-key=...`). localOnlyCIDR defaults to nfsClientCIDR
# when unset.
apps:
  namespace: naslos-apps
  officialSource:
    name: naslos
    displayName: NaslosCharts
    # The charts repository is public, so clone it over HTTPS with no
    # credentials. (SSH with a deploy key is also supported; it needs a
    # naslos-charts-deploy-key Secret with an `ssh-private-key` key.)
    url: https://github.com/AessemOps/NaslosCharts.git
    auth: public
    credentialsSecret: ""
    # NaslosCharts currently has only a `main` branch, so map the channels onto
    # it; add real Prod/Develop/Experimental branches and drop this later.
    channels:
      Prod: main

# Domains Authelia protects. App subdomains under these can use auth; a base
# domain outside the list is limited to TLS-off or no-auth exposure.
sso:
  domains:
    - naslos.local

# Dynamic DNS (docs/dynamic-dns.md): providers are declarative; OVH and
# Cloudflare work out of the box. Credentials written through the UI land in a
# Secret in naslos-apps (the API already has Secret CRUD there).
ddns:
  enabled: true

# Traefik is the only listener: it binds the node's 80/443 (hostPort) so URLs
# carry no port, and the Service stays ClusterIP. If your environment provides a
# LoadBalancer (e.g. MetalLB), drop the hostPorts and set the service type back
# to LoadBalancer.
traefik:
  ports:
    web:
      hostPort: 80
    websecure:
      hostPort: 443
  service:
    type: ClusterIP

# IngressRoutes + Authelia forwardAuth. This is what makes every request
# authenticated; there is no other entry point.
ingress:
  enabled: true

# NetworkPolicy CIDRs for this node (AUDIT-M4). These are inert under flannel but
# must be right before a policy CNI is installed: the agent, samba, nfs and the
# Talos API are hostNetwork at the node IP 192.168.1.117, and Traefik's hostPort
# entry traffic also arrives from the node address. `nodeCIDR` is what lets the
# API reach the agent (:9090) and the Talos API (:50000) once enforced.
networkPolicy:
  nodeCIDR: 192.168.1.0/24
  ingressPluginsCIDR: 192.168.1.0/24
  nfsClientCIDR: 192.168.1.0/24
  # The app installer clones git chart repositories from the API pod, so allow
  # outbound git (HTTPS/SSH/git://) to the Internet. Narrow gitEgressCIDRs to a
  # mirror's range for an air-gapped or egress-restricted network.
  gitEgress: true
  # Dynamic DNS detects the public IP (api.ipify.org / api6.ipify.org) and
  # calls the provider APIs (OVH, Cloudflare) from the API pod. Port-scoped to
  # 80/443; narrow ddnsEgressCIDRs for an egress-restricted network.
  ddnsEgress: true

# OVH certificates (spec FR-APP-13/FR-DNS-05). OVH is not a cert-manager
# built-in DNS-01 solver, so `make install-vm` installs cert-manager and the
# cert-manager-webhook-ovh webhook as separate releases in the `cert-manager`
# namespace (see the Makefile) rather than via the chart's `certManager.enabled`
# subchart, which would land them under the naslos default-deny policies. This
# wires the webhook's read access to the domain credential Secrets the API
# writes in `naslos-apps`.
ovhWebhook:
  enabled: true

# Buddy Backup receive side (AUDIT-H2). The dataset exists on the node; before
# this was set the release ran buddy.enabled=false while the peer API was live,
# so BUDDY_RECEIVE_PATH was unset and received chunks landed on the 64 MiB
# shares PVC instead of here (lost when that PVC was recreated).
buddy:
  enabled: true
  receiveHostPath: /var/mnt/test/naslos-buddy
