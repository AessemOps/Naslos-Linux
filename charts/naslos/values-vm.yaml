# Naslos Helm values for the production bare-metal node (192.168.1.38).
# The `vm` name is historical: the old 192.168.1.117 VM is powered off.
#
# This is the production posture: Traefik on the node's 80/443 with Authelia
# forwardAuth, the portal at https://naslos.local/authelia, and no
# unauthenticated listener anywhere. There is no dev/NodePort profile.
#
# Usage:
#   make install-vm
# or manually:
#   helm upgrade --install naslos charts/naslos -n naslos --create-namespace \
#     -f charts/naslos/values.yaml -f charts/naslos/values-vm.yaml

# Images come from GitHub Container Registry (ghcr.io/aessemops). The public
# packages need no imagePullSecret; the former private registry at
# 192.168.1.2:30095 is offline and must not be used.

# The tags below are the ones actually deployed on the VM. `scripts/deploy-vm.sh`
# overrides them with its IMAGE_TAG at install time, but a bare `make install-vm`
# uses these — leaving them at a tag that does not exist is what produced
# ErrImagePull on the samba/nfs/terminal DaemonSets (the registry has no plain
# `0.1.0` for those, only for api/agent/ui/openldap, which would silently roll
# the API back to old code).
api:
  image:
    repository: ghcr.io/aessemops/naslos-api
    # v0.7.62 release image (NAT-only VM networking; per-namespace app status);
    # the digest is the pin that actually gets pulled (FR-INSTALL-13).
    tag: "0.7.62"
    digest: ""
  # The API manages the node via the Talos API; without this it crashes at
  # startup with "Failed to create Talos client: failed to determine
  # endpoints". Create the secret first:
  #   kubectl create secret generic naslos-talosconfig -n naslos \
  #     --from-file=talosconfig=bootstrap/vm/talosconfig-pod
  # (talosconfig-pod is the talosconfig with a real `endpoints:` entry —
  # the CLI talosconfig generated by `make bootstrap-vm` has an empty list
  # since endpoints are normally passed via --endpoints on the CLI).
  talosConfigSecret: "naslos-talosconfig"
  # LDAP CA certificate for the API; the chart default is fine for the VM
  # because the chart creates naslos-openldap-tls (lookup-guarded) itself.
  # ldapCA:
  #   secretName: naslos-openldap-tls
  #   key: ca.crt
agent:
  image:
    repository: ghcr.io/aessemops/naslos-agent
    # Pinned by digest from the v0.7.62 release (NAS-022).
    tag: "0.7.62"
    digest: ""
ui:
  image:
    repository: ghcr.io/aessemops/naslos-ui
    # v0.7.62 release image; the digest is the pin (FR-INSTALL-13).
    tag: "0.7.62"
    digest: ""
# Share services (SMB + NFS) for the single-node VM.
shares:
  smb:
    image:
      repository: ghcr.io/aessemops/naslos-samba
      tag: "0.7.62"
      digest: ""
  nfs:
    image:
      repository: ghcr.io/aessemops/naslos-nfs
      # The NFS image needs CAP_SYS_RESOURCE for PR_SET_IO_FLUSHER (added in
      # nfs-daemonset.yaml); with that, Ganesha 6.5 starts with the same
      # rendered ganesha.conf as 4.x.
      tag: "0.7.62"
      digest: ""
terminal:
  image:
    repository: ghcr.io/aessemops/naslos-terminal
    tag: "0.7.62"
    digest: ""
# Virtual machines (FR-VMT). The vmd image fixes the startup panic (an
# explicit rustls crypto provider), so the supervisor is enabled and pinned
# to the release image (NAS-022); the API env wiring and /api/virt/* go
# live with it.
virt:
  enabled: true
  image:
    repository: ghcr.io/aessemops/naslos-vmd
    # v0.7.62 release image (NAT-only networking; keeps the supervisor fixes).
    # Built with the bookworm builder since 0.7.62: the earlier images linked
    # against Debian 13's glibc 2.41 and crash-looped on this Debian 12 runtime
    # with "GLIBC_2.38 not found".
    tag: "0.7.62"
    digest: ""
openldap:
  # Debian 13 / slapd 2.6.10 with /var/run/slapd created in the image and
  # LDAPS-only listening (LDAP_TLS_ENFORCE; no plaintext ldap:///).
  image: ghcr.io/aessemops/naslos-openldap:0.7.62
  # OpenLDAP host is the service name for internal cluster references.
  host: naslos-openldap
  # No bindPassword here. The chart reads the service password from the
  # naslos-openldap Secret (key service-password), which the chart's
  # lookup-guarded Secret creates and the naslos-openldap-bootstrap Job applies
  # to the directory; rotating it is a Secret patch plus a bootstrap re-run,
  # and nothing lands in git (AUDIT-H1).

# The public name: session cookie domain, TOTP issuer and TLS SAN. It resolves
# through the mDNS record the Samba container advertises; add a router A record
# (naslos.local -> the VM IP) for clients without mDNS (Windows).
domain: naslos.local

# App install subsystem: the official chart repository is the NaslosCharts git
# repo, cloned over SSH with a deploy key held in a Secret (create it with
# `kubectl -n naslos create secret generic naslos-charts-deploy-key
#  --from-file=ssh-private-key=...`). localOnlyCIDR defaults to nfsClientCIDR
# when unset.
apps:
  namespace: naslos-apps
  isolation:
    enabled: true
    # 32 provisioned baseline slots, 20 usable by default. The owner can raise
    # the usable limit up to 32 from Apps → Installed without another platform
    # upgrade.
    namespaces: 32
    defaultLimit: 20
    privilegedNamespaces: 4
  datasets:
    # R-012 (D3/F1 closed on this profile): never expose the shared /var/mnt
    # root on the production node. With isolation enabled, the API provisions
    # one PV/PVC per attached dataset instead, so VM datasets
    # (<pool>/vms), the Buddy store and every other sibling stay unreachable
    # from an app. The base values keep the legacy shared claim for installs
    # that explicitly want it; the production overlay must not.
    enabled: false
  officialSource:
    name: naslos
    displayName: NaslosCharts
    # The charts repository is public, so clone it over HTTPS with no
    # credentials. (SSH with a deploy key is also supported; it needs a
    # naslos-charts-deploy-key Secret with an `ssh-private-key` key.)
    url: https://github.com/AessemOps/NaslosCharts.git
    auth: public
    # Follow the channel branch: every catalog refresh fetches `main`, so new
    # charts appear without a release. Set a full 40-character SHA here to pin
    # the catalog to an audited commit instead (SEC-2026-D6).
    credentialsSecret: ""
    # NaslosCharts currently has only a `main` branch, so map the channels onto
    # it; add real Prod/Develop/Experimental branches and drop this later.
    channels:
      Prod: main

# Domains Authelia protects. App subdomains under these can use auth; a base
# domain outside the list is limited to TLS-off or no-auth exposure.
sso:
  domains:
    - naslos.local

# Dynamic DNS (docs/dynamic-dns.md): providers are declarative; OVH and
# Cloudflare work out of the box. Credentials written through the UI land in a
# Secret in naslos-apps (the API already has Secret CRUD there).
ddns:
  enabled: true

# Traefik is the only listener: it binds the node's 80/443 (hostPort) so URLs
# carry no port, and the Service stays ClusterIP. If your environment provides a
# LoadBalancer (e.g. MetalLB), drop the hostPorts and set the service type back
# to LoadBalancer.
traefik:
  ports:
    web:
      hostPort: 80
    websecure:
      hostPort: 443
  service:
    type: ClusterIP
  # R-011: namespaced RBAC. The list replaces the base value and names every
  # namespace Traefik reads: the release namespace (the platform IngressRoutes
  # live there, and the upstream namespaces helper does not add it
  # automatically) plus the shared app namespaces and the fixed per-app
  # isolation pool (baseline 1-32, privileged p1-p4), whose Services the
  # cross-namespace IngressRoutes target. Keep it in step with
  # apps.isolation.namespaces/privilegedNamespaces.
  rbac:
    namespaced: true
  providers:
    kubernetesCRD:
      namespaces:
        - naslos
        - naslos-apps
        - naslos-apps-priv
        - naslos-app-1
        - naslos-app-2
        - naslos-app-3
        - naslos-app-4
        - naslos-app-5
        - naslos-app-6
        - naslos-app-7
        - naslos-app-8
        - naslos-app-9
        - naslos-app-10
        - naslos-app-11
        - naslos-app-12
        - naslos-app-13
        - naslos-app-14
        - naslos-app-15
        - naslos-app-16
        - naslos-app-17
        - naslos-app-18
        - naslos-app-19
        - naslos-app-20
        - naslos-app-21
        - naslos-app-22
        - naslos-app-23
        - naslos-app-24
        - naslos-app-25
        - naslos-app-26
        - naslos-app-27
        - naslos-app-28
        - naslos-app-29
        - naslos-app-30
        - naslos-app-31
        - naslos-app-32
        - naslos-app-p1
        - naslos-app-p2
        - naslos-app-p3
        - naslos-app-p4


# IngressRoutes + Authelia forwardAuth. This is what makes every request
# authenticated; there is no other entry point.
ingress:
  enabled: true

# NetworkPolicy CIDRs for this node (AUDIT-M4). These are inert under flannel but
# must be right before a policy CNI is installed: the agent, samba, nfs and the
# Talos API are hostNetwork at the node IP 192.168.1.38, and Traefik's hostPort
# entry traffic also arrives from the node address. `nodeCIDR` is what lets the
# API reach the agent (:9090) and the Talos API (:50000) once enforced.
networkPolicy:
  nodeCIDR: 192.168.1.0/24
  # The installer sets ingressPluginsCIDR to the node's /24; this extra allow
  # is what makes the public app domains reachable from the Internet.
  ingressPluginsCIDR: 192.168.1.0/24
  publicIngressCIDR: 0.0.0.0/0
  nfsClientCIDR: 192.168.1.0/24
  # The app installer clones git chart repositories from the API pod, so allow
  # outbound git (HTTPS/SSH/git://) to the Internet. Narrow gitEgressCIDRs to a
  # mirror's range for an air-gapped or egress-restricted network.
  gitEgress: true
  # Dynamic DNS detects the public IP (api.ipify.org / api6.ipify.org) and
  # calls the provider APIs (OVH, Cloudflare) from the API pod. Port-scoped to
  # 80/443; narrow ddnsEgressCIDRs for an egress-restricted network.
  ddnsEgress: true
  # App image release checks resolve registry tags over HTTPS from the API pod.
  # Port-scoped to 443; narrow imageEgressCIDRs for an egress-restricted network.
  imageEgress: true

# OVH certificates (spec FR-APP-13/FR-DNS-05). OVH is not a cert-manager
# built-in DNS-01 solver, so `make install-vm` installs cert-manager and the
# cert-manager-webhook-ovh webhook as separate releases in the `cert-manager`
# namespace (see the Makefile) rather than via the chart's `certManager.enabled`
# subchart, which would land them under the naslos default-deny policies. This
# wires the webhook's read access to the domain credential Secrets the API
# writes in `naslos-apps`.
ovhWebhook:
  enabled: true

# Web-upgrader release facts (docs/installer-contract.md §7). This production
# node was installed with `make install-vm`, but the chart carries the full
# upgrader wiring; declaring the facts makes `profile: installer` true so the
# API polls releases, the System page enables web upgrades and the upgrader
# SA/RBAC/Job resources render. Keep these in step with the deployed release.
release:
  profile: installer
  naslosVersion: "0.7.62"
  chartVersion: "0.7.62"
  talosVersion: "v1.14.6"
  kubernetesVersion: "v1.37.0"
  schematicId: "4dd8e3a8b6203d3c14f049da8db4d3bb0d6d3e70c5e89dfcc1e709e81914f63c"

# Buddy Backup receive side (AUDIT-H2). The dataset exists on the node; before
# this was set the release ran buddy.enabled=false while the peer API was live,
# so BUDDY_RECEIVE_PATH was unset and received chunks landed on the 64 MiB
# shares PVC instead of here (lost when that PVC was recreated). The old
# /var/mnt/test path was removed from the pool; keep the store on the SSD
# dataset and create it before deploying (owner 10001:10000, mode 2770).
buddy:
  enabled: true
  receiveHostPath: /var/mnt/ssd-storage/naslos-buddy
