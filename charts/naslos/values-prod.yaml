# Production posture for the single-node VM (192.168.1.117).
#
# Layered on top of values.yaml + values-vm.yaml, which keep the VM-specific
# image registries, the Talos config secret and the bind password:
#
#   helm upgrade --install naslos charts/naslos -n naslos --create-namespace \
#     -f charts/naslos/values.yaml \
#     -f charts/naslos/values-vm.yaml \
#     -f charts/naslos/values-prod.yaml
#
# or `make install-prod`. Do NOT add `--reuse-values` to the upgrade: it would
# keep the dev keys this file is meant to replace.
#
# values-vm.yaml is the dev posture (auth off, UI on a NodePort, no proxy). This
# file turns the instance into the proxy-authenticated one:
#
#   https://naslos.local -> Traefik (hostPort 80/443)
#                          -> Authelia forwardAuth (portal at /authelia, 2FA on
#                             every admin surface)
#                          -> naslos-ui for the SPA, naslos-api for /api
#
# Rollback = the same command minus this file (see docs/deployment.md).

ingress:
  enabled: true

auth:
  disabled: false

authelia:
  # Also the session cookie domain, the TOTP issuer and the TLS SAN. Resolves
  # through the mDNS record the Samba container already advertises
  # (host-name=naslos -> naslos.local); add a router A record
  # (naslos.local -> <VM IP>) for clients without mDNS (Windows).
  domain: naslos.local

ui:
  # The NodePort reaches every route without the proxy secret, so it is both
  # useless (the API answers 401) and unwanted exposure once auth is on. The
  # authenticated path is Traefik only.
  nodePort:
    enabled: false

traefik:
  # Bind the node's own 80/443 so URLs carry no port. Single-node appliance, so
  # there is no second replica to conflict with the hostPort.
  ports:
    web:
      hostPort: 80
    websecure:
      hostPort: 443
  service:
    type: ClusterIP
