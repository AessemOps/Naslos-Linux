{{- if and .Values.ui.enabled .Values.ui.nodePort.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-ui-nodeport
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-ui
    app.kubernetes.io/component: ui-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: naslos-ui
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: 80
      nodePort: {{ .Values.ui.nodePort.port }}
      protocol: TCP
      name: http
{{- end }}
