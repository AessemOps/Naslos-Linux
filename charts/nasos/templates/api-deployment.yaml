{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: naslos-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: naslos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naslos-api
    spec:
      serviceAccountName: naslos-api
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NASLOS_NAMESPACE
              value: {{ .Values.namespace }}
            {{- if .Values.api.talosEndpoints }}
            # Talos API endpoints for node/disk management. The talos client
            # library reads TALOS_ENDPOINTS and fails at startup without it
            # ("Failed to create Talos client: failed to determine endpoints").
            - name: TALOS_ENDPOINTS
              value: {{ .Values.api.talosEndpoints | quote }}
            {{- end }}
            - name: LDAP_BIND_PASS
              valueFrom:
                secretKeyRef:
                  name: naslos-openldap
                  key: service-password
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: naslos-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naslos-api
  namespace: {{ .Values.namespace }}
{{- end }}
