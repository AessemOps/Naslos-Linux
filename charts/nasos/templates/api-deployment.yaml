{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasos-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nasos-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nasos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nasos-api
    spec:
      serviceAccountName: nasos-api
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NASOS_NAMESPACE
              value: {{ .Values.namespace }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nasos-api
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: nasos-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nasos-api
  namespace: {{ .Values.namespace }}
{{- end }}
