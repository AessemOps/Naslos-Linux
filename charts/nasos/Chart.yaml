apiVersion: v2
name: nasos
description: NasOS - A user-friendly NAS distribution for Talos Linux
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - nas
  - talos
  - zfs
  - storage
  - smb
  - nfs
home: https://github.com/nasos/nasos
sources:
  - https://github.com/nasos/nasos
maintainers:
  - name: NasOS Team
    email: team@nasos.dev
dependencies:
  - name: ntfy
    version: "0.1.0"
    repository: https://helm.ntfy.sh/
    condition: ntfy.enabled
  - name: prometheus
    version: "25.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.0.0"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
