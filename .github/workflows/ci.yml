# Continuous integration for Naslos-Linux.
#
# Every PR and push to master runs the full gate sweep (`scripts/audit.sh`, with
# the security tools installed so they do not silently skip), a dedicated secret
# scan, a Docker build of every image (no push) and a local install-pack build.
# The release path (images -> digest-pinned pack -> release -> installer
# dispatch) is `.github/workflows/release.yml`.
#
# Third-party actions are pinned to immutable commit SHAs (a tag can be moved);
# the repo convention is `owner/action@<sha> # vX`.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the 8 image build contexts. release.yml reads the
  # same file, so the CI and release matrices cannot drift.
  image-matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: echo "images=$(jq -c . .github/image-matrix.json)" >> "$GITHUB_OUTPUT"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Install scanners
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          version=0.76.1
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          tarball="trivy_${version}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o trivy_checksums.txt "${base}/trivy_${version}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Rust advisories, licenses, bans, sources
        run: cd rust && cargo audit --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 && cargo deny check advisories bans licenses sources

      - name: Filesystem vulnerability + secret scan
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            --skip-dirs ui/node_modules --skip-dirs rust/target --skip-dirs .git .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install UI dependencies
        # The committed lock is resolved here (glibc); ui/Dockerfile resolves
        # in-image for the musl build (npm/cli#4828).
        run: cd ui && npm ci --no-audit --no-fund

      - name: Install PyYAML (audit.sh parses rendered manifests)
        run: python3 -m pip install pyyaml

      - name: Gate sweep
        run: bash scripts/audit.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # The CLI (MIT); the gitleaks-action needs a commercial license for an
        # organization account. Pinned release, checksum-verified.
        run: |
          set -euo pipefail
          version=8.30.1
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o gitleaks_checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " ${tarball}\$" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact

      - name: Scan git history
        run: gitleaks git . --config .gitleaks-history.toml --no-banner --redact

  images-build:
    needs: image-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.name == 'buddy-receiver' && 'VERSION=ci' || '' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: naslos-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.76.1
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          tarball="trivy_${version}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o trivy_checksums.txt "${base}/trivy_${version}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          install -m 0755 trivy /usr/local/bin/trivy

      - name: Scan ${{ matrix.name }} for HIGH/CRITICAL CVEs
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "naslos-${{ matrix.name }}:ci"

      - name: SBOM for ${{ matrix.name }} (CycloneDX)
        run: |
          trivy image --format cyclonedx \
            --output "sbom-${{ matrix.name }}.cdx.json" "naslos-${{ matrix.name }}:ci"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the install pack (tag placeholders)
        run: make install-pack

      - name: Verify the pack checksum
        run: cd dist && sha256sum -c naslos-install-pack-*.tar.gz.sha256
