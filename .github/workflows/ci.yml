# Continuous integration for Naslos-Linux.
#
# Every PR and push to master runs the full gate sweep (`scripts/audit.sh`, with
# the security tools installed so they do not silently skip), a dedicated secret
# scan, a Docker build of every image (no push) and a local install-pack build.
# The release path (images -> digest-pinned pack -> release -> installer
# dispatch) is `.github/workflows/release.yml`.
#
# Third-party actions are pinned to immutable commit SHAs (a tag can be moved);
# the repo convention is `owner/action@<sha> # vX`.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the 8 image build contexts. release.yml reads the
  # same file, so the CI and release matrices cannot drift.
  image-matrix:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "images=$(jq -c . .github/image-matrix.json)" >> "$GITHUB_OUTPUT"

  supply-chain:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Install scanners
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          # Pinned (not floating) for determinism, current as of 2026-11-20:
          # 0.22.0 declares rust-version 1.95, satisfied by the pinned
          # toolchain above. Bump deliberately, with the gate re-run.
          cargo install cargo-deny --version 0.22.0 --locked
          # The self-hosted runner ships trivy; only fetch it when absent.
          if ! command -v trivy >/dev/null 2>&1; then
            version=0.76.1
            base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
            tarball="trivy_${version}_Linux-64bit.tar.gz"
            curl -fsSL -o "$tarball" "${base}/${tarball}"
            curl -fsSL -o trivy_checksums.txt "${base}/trivy_${version}_checksums.txt"
            grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
            tar -xzf "$tarball" trivy
            mkdir -p "$RUNNER_TEMP/bin"
            install -m 0755 trivy "$RUNNER_TEMP/bin/trivy"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            trivy="$RUNNER_TEMP/bin/trivy"
          else
            trivy=trivy
          fi
          "$trivy" --version

      - name: Rust advisories, licenses, bans, sources
        run: cd rust && cargo audit --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 && cargo deny check advisories bans licenses sources

      - name: Filesystem vulnerability + secret scan
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            --skip-dirs ui/node_modules --skip-dirs rust/target --skip-dirs bootstrap/vm --skip-dirs .git . --ignorefile .trivyignore

  audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install UI dependencies
        # The committed lock is resolved here (glibc); ui/Dockerfile resolves
        # in-image for the musl build (npm/cli#4828).
        run: cd ui && npm ci --no-audit --no-fund

      - name: Install PyYAML (audit.sh parses rendered manifests)
        run: python3 -m pip install pyyaml

      - name: Gate sweep
        run: bash scripts/audit.sh

  gitleaks:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # The CLI (MIT); the gitleaks-action needs a commercial license for an
        # organization account. Pinned release, checksum-verified.
        run: |
          set -euo pipefail
          # The self-hosted runner ships gitleaks; only fetch it when absent.
          if ! command -v gitleaks >/dev/null 2>&1; then
            version=8.30.1
            tarball="gitleaks_${version}_linux_x64.tar.gz"
            base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
            curl -fsSL -o "$tarball" "${base}/${tarball}"
            curl -fsSL -o gitleaks_checksums.txt "${base}/gitleaks_${version}_checksums.txt"
            grep " ${tarball}\$" gitleaks_checksums.txt | sha256sum -c -
            tar -xzf "$tarball" gitleaks
            mkdir -p "$RUNNER_TEMP/bin"
            install -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            gitleaks="$RUNNER_TEMP/bin/gitleaks"
          else
            gitleaks=gitleaks
          fi
          "$gitleaks" version

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact

      - name: Scan git history
        run: gitleaks git . --config .gitleaks-history.toml --no-banner --redact

  images-build:
    needs: image-matrix
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.name == 'buddy-receiver' && 'VERSION=ci' || '' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: naslos-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            version=0.76.1
            base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
            tarball="trivy_${version}_Linux-64bit.tar.gz"
            curl -fsSL -o "$tarball" "${base}/${tarball}"
            curl -fsSL -o trivy_checksums.txt "${base}/trivy_${version}_checksums.txt"
            grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
            tar -xzf "$tarball" trivy
            mkdir -p "$RUNNER_TEMP/bin"
            install -m 0755 trivy "$RUNNER_TEMP/bin/trivy"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Scan ${{ matrix.name }} for HIGH/CRITICAL CVEs
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile .trivyignore "naslos-${{ matrix.name }}:ci"

      - name: SBOM for ${{ matrix.name }} (CycloneDX)
        run: |
          trivy image --format cyclonedx \
            --output "sbom-${{ matrix.name }}.cdx.json" "naslos-${{ matrix.name }}:ci"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

  pack:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml

      - name: Build the install pack (tag placeholders)
        run: make install-pack

      - name: Verify the pack checksum
        run: cd dist && sha256sum -c naslos-install-pack-*.tar.gz.sha256
