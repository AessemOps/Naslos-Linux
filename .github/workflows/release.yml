# Release: publish the Naslos images to GHCR and the digest-pinned install pack
# the desktop installer embeds (spec FR-INSTALL-13; docs/installer-contract.md).
#
# Ordering is the whole point: images land first, then the pack is built from
# their digests, then the release is attached and AessemOps/Naslos-Installer is
# dispatched (`naslos-release`). One `vX.Y.Z` tag therefore produces images and a
# pack that references exactly those images, atomically. Never push a throwaway
# strict-semver tag: the installer resolves the newest `vX.Y.Z` and would pick it
# up. Use `workflow_dispatch` with `publish=false` for a dry run.
#
# Prerequisites (operator, documented in docs/deployment.md):
#   - `INSTALLER_DISPATCH_TOKEN`: fine-grained PAT with `Contents: read and
#     write` (or `Actions: write`) on AessemOps/Naslos-Installer. Absent => the
#     dispatch step is skipped, the pack still publishes.
#   - The 8 GHCR packages made public (one-time, per package): the provisioned
#     node has no imagePullSecret and pulls anonymously. `GITHUB_TOKEN` +
#     `packages: write` can publish but cannot change visibility.
#
# Third-party actions are pinned to immutable commit SHAs (a tag can be moved).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, strict X.Y.Z (no leading v)"
        required: true
        type: string
      publish:
        description: "Attach the release + dispatch the installer (false = dry run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and guard the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          else
            version="${REF_NAME#v}"
            publish="true"
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release guard: '$version' is not strict semver X.Y.Z" >&2
            exit 1
          fi
          scripts/check-release-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  images:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: api/Dockerfile
          - name: agent
            context: .
            file: agent/Dockerfile
          - name: ui
            context: .
            file: ui/Dockerfile
          - name: samba
            context: samba/image
            file: samba/image/Dockerfile
          - name: nfs
            context: nfs/image
            file: nfs/image/Dockerfile
          - name: terminal
            context: terminal/image
            file: terminal/image/Dockerfile
          - name: openldap
            context: openldap/image
            file: openldap/image/Dockerfile
          - name: buddy-receiver
            context: .
            file: api/Dockerfile.receiver
            build-args: VERSION=${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/aessemops/naslos-${{ matrix.name }}:${{ needs.guard.outputs.version }}
            ghcr.io/aessemops/naslos-${{ matrix.name }}:sha-${{ github.sha }}

      - name: Record the digest
        run: |
          printf '%s@%s' \
            "ghcr.io/aessemops/naslos-${{ matrix.name }}" \
            "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.name }}.txt"
          cat "digest-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 1

  pack:
    needs: [guard, images]
    runs-on: ubuntu-latest
    env:
      INSTALLER_DISPATCH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the image digest map
        # Only the 7 chart images go into the pack; buddy-receiver is published
        # for the standalone Docker use case and is not part of the chart.
        run: |
          scripts/collect-image-digests.sh \
            dist/digests/digest-api.txt \
            dist/digests/digest-agent.txt \
            dist/digests/digest-ui.txt \
            dist/digests/digest-samba.txt \
            dist/digests/digest-nfs.txt \
            dist/digests/digest-terminal.txt \
            dist/digests/digest-openldap.txt > dist/image-digests.json
          cat dist/image-digests.json

      - name: Verify every digest resolves
        run: |
          set -euo pipefail
          python3 -c 'import json; [print(v) for v in json.load(open("dist/image-digests.json")).values()]' |
          while read -r ref; do
            docker buildx imagetools inspect "$ref" >/dev/null
            echo "resolved $ref"
          done

      - name: Build the digest-pinned pack
        run: |
          make install-pack \
            PACK_VERSION="${{ needs.guard.outputs.version }}" \
            IMAGE_DIGESTS_FILE=dist/image-digests.json

      - name: Render the packed chart with digests
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/naslos-install-pack-*.tar.gz
          pack=$(echo "$tmp"/naslos-install-pack-*)
          helm template naslos "$pack/charts/naslos" -n naslos \
            -f "$pack/charts/naslos/values.yaml" \
            -f "$pack/charts/naslos/values-installer.yaml" >/dev/null
          echo "packed chart renders with digest-pinned images"

      - name: Upload the pack (dry run)
        if: needs.guard.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naslos-install-pack
          path: |
            dist/naslos-install-pack-*.tar.gz
            dist/naslos-install-pack-*.tar.gz.sha256
          if-no-files-found: error

      - name: Attach the pack to the release
        if: needs.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          files: |
            dist/naslos-install-pack-*.tar.gz
            dist/naslos-install-pack-*.tar.gz.sha256
          fail_on_unmatched_files: true

      # Rebuild the installer against this pack. Skipped until the PAT secret is
      # configured; the pack release itself is unaffected.
      - name: Dispatch the installer rebuild
        if: needs.guard.outputs.publish == 'true' && env.INSTALLER_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.INSTALLER_DISPATCH_TOKEN }}
        run: |
          gh api repos/AessemOps/Naslos-Installer/dispatches \
            -f event_type=naslos-release \
            -f client_payload[tag]="${{ needs.guard.outputs.tag }}" \
            -f client_payload[version]="${{ needs.guard.outputs.version }}"
