# Release: publish the Naslos images to GHCR and the digest-pinned install pack
# the desktop installer embeds (spec FR-INSTALL-13; docs/installer-contract.md).
#
# Ordering is the whole point: images land first, then the pack is built from
# their digests, then the release is attached and AessemOps/Naslos-Installer is
# dispatched (`naslos-release`). One `vX.Y.Z` tag therefore produces images and a
# pack that references exactly those images, atomically. Never push a throwaway
# strict-semver tag: the installer resolves the newest `vX.Y.Z` and would pick it
# up. Use `workflow_dispatch` with `publish=false` for a dry run (it pushes only
# the `sha-<commit>` tag, never the mutable `:<version>` tag).
#
# Prerequisites (operator, documented in docs/deployment.md):
#   - `INSTALLER_DISPATCH_TOKEN`: fine-grained PAT with `Contents: read and
#     write` (or `Actions: write`) on AessemOps/Naslos-Installer. Absent => the
#     dispatch step is skipped, the pack still publishes.
#   - The 8 GHCR packages made public (one-time, per package): the provisioned
#     node has no imagePullSecret and pulls anonymously. `GITHUB_TOKEN` +
#     `packages: write` can publish but cannot change visibility. A `publish=true`
#     release fails if they are not anonymously pullable.
#
# If a `vX.Y.Z` run fails before attaching the pack, delete the tag before
# retrying: the installer resolves the newest strict-semver tag and would
# otherwise select a packless tag.
#
# Third-party actions are pinned to immutable commit SHAs (a tag can be moved).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, strict X.Y.Z (no leading v)"
        required: true
        type: string
      publish:
        description: "Attach the release + dispatch the installer (false = dry run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One release at a time globally: a tag push and a dispatch must never race on
  # the immutable GitHub release (SEC-2026-G9).
  group: release
  cancel-in-progress: false

jobs:
  # Shared with ci.yml (`.github/image-matrix.json`): the two workflows cannot
  # drift on which images exist or how they are built.
  image-matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: echo "images=$(jq -c . .github/image-matrix.json)" >> "$GITHUB_OUTPUT"

  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and guard the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          else
            version="${REF_NAME#v}"
            publish="true"
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release guard: '$version' is not strict semver X.Y.Z" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" != "push" ] && [ "$publish" = "true" ]; then
            echo "release guard: publish=true is only allowed for a vX.Y.Z tag push (use publish=false for a dry run)" >&2
            exit 1
          fi
          scripts/check-release-version.sh "$version"
          scripts/check-system-pins.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  images:
    needs: [guard, image-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the image tags
        id: tags
        env:
          COMPONENT: ${{ matrix.name }}
          PUBLISH: ${{ needs.guard.outputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/aessemops/naslos-${COMPONENT}"
          {
            echo "tags<<EOF"
            # Every run pushes an immutable commit tag; only a real tag push
            # (publish=true on a `push` event) moves the mutable `:<version>`
            # tag, so neither a dry run nor a re-dispatch can overwrite a
            # released version.
            echo "${image}:sha-${SHA}"
            if [ "$PUBLISH" = "true" ] && [ "$EVENT_NAME" = "push" ]; then
              echo "${image}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to move an already-published :${{ needs.guard.outputs.version }} tag
        if: needs.guard.outputs.publish == 'true' && github.event_name == 'push'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          image="${{ matrix.repository }}"
          if docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null 2>&1; then
            echo "release: ${image}:${VERSION} already exists. Re-running a release would move the tag while the attached pack keeps the old digests. Delete the release and tag, then re-run." >&2
            exit 1
          fi

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.name == 'buddy-receiver' && format('VERSION={0}', needs.guard.outputs.version) || '' }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}

      - name: Record the digest
        run: |
          printf '%s@%s' \
            "ghcr.io/aessemops/naslos-${{ matrix.name }}" \
            "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.name }}.txt"
          cat "digest-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 1

  pack:
    needs: [guard, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (pin-installer-values.py rewrites the profiles)
        run: python3 -m pip install pyyaml==6.0.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the image digest map
        # Only the 7 chart images go into the pack; buddy-receiver is published
        # for the standalone Docker use case and is not part of the chart.
        run: |
          scripts/collect-image-digests.sh \
            dist/digests/digest-api.txt \
            dist/digests/digest-agent.txt \
            dist/digests/digest-ui.txt \
            dist/digests/digest-samba.txt \
            dist/digests/digest-nfs.txt \
            dist/digests/digest-terminal.txt \
            dist/digests/digest-openldap.txt > dist/image-digests.json
          cat dist/image-digests.json

      - name: Verify every digest resolves
        run: |
          set -euo pipefail
          python3 -c 'import json; [print(v) for v in json.load(open("dist/image-digests.json")).values()]' |
          while read -r ref; do
            docker buildx imagetools inspect "$ref" >/dev/null
            echo "resolved $ref"
          done

      # FR-INSTALL-13: the provisioned node pulls anonymously, so a published
      # release must be anonymously pullable. Check before the pack is built and
      # attached, so a private package fails the release instead of the install.
      - name: Verify anonymous pullability (release only)
        if: needs.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # A fresh config dir guarantees no cached GHCR credential is used;
          # `docker logout || true` alone could leave a credential helper.
          export DOCKER_CONFIG=$(mktemp -d)
          python3 -c 'import json; [print(v) for v in json.load(open("dist/image-digests.json")).values()]' |
          while read -r ref; do
            docker buildx imagetools inspect "$ref" >/dev/null
            echo "anonymous pull ok: $ref"
          done

      - name: Note the anonymous-pull requirement (dry run)
        if: needs.guard.outputs.publish != 'true'
        run: |
          echo "dry run: skipping the anonymous pull check; make the GHCR packages public before a real release"

      - name: Build the digest-pinned pack
        run: |
          make install-pack \
            PACK_VERSION="${{ needs.guard.outputs.version }}" \
            IMAGE_DIGESTS_FILE=dist/image-digests.json

      - name: Render the packed chart with digests
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/naslos-install-pack-*.tar.gz
          pack=$(echo "$tmp"/naslos-install-pack-*)
          helm template naslos "$pack/charts/naslos" -n naslos \
            -f "$pack/charts/naslos/values.yaml" \
            -f "$pack/charts/naslos/values-installer.yaml" >/dev/null
          echo "packed chart renders with digest-pinned images"

      - name: Upload the pack (dry run)
        if: needs.guard.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naslos-install-pack
          path: |
            dist/naslos-install-pack-*.tar.gz
            dist/naslos-install-pack-*.tar.gz.sha256
          if-no-files-found: error

      - name: Require green CI for this commit
        if: needs.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `all(... == "success")` is vacuously true for an empty array and
          # only the first page of check-runs was read, so a commit with none of
          # these checks (or with a re-run failure on page 2) passed. Paginate,
          # keep the latest run per name, and require all three to be present.
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs[]' > /tmp/check-runs.ndjson
          python3 - <<'PY'
          import json

          wanted = {"audit", "supply-chain", "gitleaks"}
          latest = {}
          with open("/tmp/check-runs.ndjson", encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  run = json.loads(line)
                  if run.get("name") in wanted:
                      latest[run["name"]] = run.get("conclusion")
          missing = sorted(wanted - set(latest))
          bad = {k: v for k, v in latest.items() if v != "success"}
          if missing or bad:
              raise SystemExit(
                  f"release: CI is not green for the tagged commit (missing={missing}, not-success={bad})"
              )
          print("release: audit, supply-chain and gitleaks are green for this commit")
          PY
      - name: Verify the pack checksum before attaching
        if: needs.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c naslos-install-pack-*.tar.gz.sha256

      - name: Attach the pack to the release
        if: needs.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          PACK: naslos-install-pack-${{ needs.guard.outputs.version }}.tar.gz
        run: |
          set -euo pipefail
          # The repo has immutable releases: an asset can only be attached when
          # the release is created, never uploaded afterwards. A tag push may
          # auto-create an empty release, so: keep one that already has the pack
          # (a re-run), otherwise remove the empty/asset-less release and create
          # it again WITH the pack in the same call.
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                     --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -qx "$PACK"; then
            echo "pack already attached to $TAG (immutable release); leaving it in place"
          else
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Asset-less release (e.g. auto-created by the tag push): drop it.
              gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
            fi
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
              dist/naslos-install-pack-*.tar.gz \
              dist/naslos-install-pack-*.tar.gz.sha256
          fi

      # Rebuild the installer against this pack. The PAT is scoped to this step
      # only; an absent secret skips the dispatch without failing the release.
      - name: Dispatch the installer rebuild
        if: needs.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "INSTALLER_DISPATCH_TOKEN is not configured; skipping the installer dispatch."
            exit 0
          fi
          if ! gh api repos/AessemOps/Naslos-Installer/dispatches \
            -f event_type=naslos-release \
            -f "client_payload[tag]=${{ needs.guard.outputs.tag }}" \
            -f "client_payload[version]=${{ needs.guard.outputs.version }}"; then
            echo "::error::installer dispatch failed; rotate INSTALLER_DISPATCH_TOKEN (contents:write on AessemOps/Naslos-Installer) and run scripts/dispatch-installer.sh ${{ needs.guard.outputs.tag }} with a valid gh login"
            exit 1
          fi
