# Build and publish the versioned install pack the desktop installer embeds
# (FR-INSTALL; docs/installer-contract.md).
#
# On a `v*` tag: `make install-pack` renders the machine-config template,
# packages the chart + vendored subcharts + Cilium + pinned local-path +
# schematic, and emits metadata.json with a sha256 per member. The tarball and
# its checksum are attached to the GitHub release. Naslos-Installer resolves the
# newest vX.Y.Z tag, downloads the pack and verifies every member checksum
# before embedding it.
#
# When it finishes, this workflow dispatches AessemOps/Naslos-Installer so the
# installer is rebuilt against the new pack (event `naslos-release`). That step
# needs the `INSTALLER_DISPATCH_TOKEN` secret: a fine-grained PAT with
# `Contents: read and write` (or `Actions: write`) on AessemOps/Naslos-Installer.
# It is skipped when the secret is absent, so the pack still publishes.
#
# No Helm registry access is needed: the subchart .tgz files are committed under
# charts/naslos/charts/.
name: install-pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTALLER_DISPATCH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
    steps:
      # Pinned to immutable commit SHAs (the tag can be moved): this workflow
      # attaches the artifact the desktop installer embeds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build install pack
        run: make install-pack PACK_VERSION="${GITHUB_REF_NAME#v}"

      - name: Attach pack to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/naslos-install-pack-*.tar.gz
            dist/naslos-install-pack-*.tar.gz.sha256
          fail_on_unmatched_files: true

      # Rebuild the installer against this pack. Skipped until the PAT secret is
      # configured; the pack release itself is unaffected.
      - name: Dispatch the installer rebuild
        if: env.INSTALLER_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.INSTALLER_DISPATCH_TOKEN }}
        run: |
          gh api repos/AessemOps/Naslos-Installer/dispatches \
            -f event_type=naslos-release \
            -f client_payload[tag]="${GITHUB_REF_NAME}" \
            -f client_payload[version]="${GITHUB_REF_NAME#v}"
