# WebSocket-aware connection handling. `Connection` must be "upgrade" only for
# upgrade requests: sending it unconditionally breaks plain HTTP keep-alive, and
# omitting it makes the terminal/log streams fail their handshake (nginx strips
# Upgrade, the API sees a normal GET, and the browser reports a failed socket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy: the SPA calls relative /api/* URLs, so nginx must
    # forward them to naslos-api:8080 (same namespace, ClusterIP service).
    # Without this, /api/disks serves index.html (HTTP 200, text/html) and
    # res.json() throws "JSON.parse: unexpected character at line 1 column 1".
    #
    # The host stays a literal name on purpose: nginx resolves it once at
    # startup through the system resolver, which applies the pod's search
    # domains, so the short name resolves in whatever namespace we deploy to.
    # (An nginx `resolver` + variable would resolve per request but does NOT
    # apply search domains, so the short name fails unless hard-coded to an
    # FQDN - that was tried and returns 502.)
    # A literal name means nginx refuses to start if the API is not in DNS yet,
    # so the pod waits for the name first (see wait-for-api in the chart).
    #
    # NOTE: proxy_pass has no URI path so the full /api/... path is preserved
    # upstream.

    # Interactive streams (terminal exec, live logs): their own location so the
    # read timeout can be long without affecting request/response calls.
    location /api/ws/ {
        proxy_pass http://naslos-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A terminal can sit idle between commands, so the socket must outlive
        # any pause a human takes; upstream closes it if the session really dies.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The terminal paths used to be refused here, because the UI was exposed on a
    # node port with no proxy in front of it. That listener is gone: the chart
    # routes /api straight from Traefik (behind Authelia forwardAuth and the
    # proxy-identity secret) to the API, and the API is the gate. There is no
    # unauthenticated path to refuse.

    location /api/ {
        proxy_pass http://naslos-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Generous read timeout: zpool create + wipefs on real disks can take
        # minutes, and the API waits synchronously for the agent. Without this
        # the wizard would see a 504 while the pool actually creates.
        proxy_read_timeout 300s;
    }

    # Buddy Backup (docs/buddy-backup.md). A peer pushes 1 MiB sealed chunks, and
    # nginx's default body limit is exactly 1 MB, so without this every chunk
    # would be rejected with a 413 before it reached the API. It gets its own
    # location (prefix match beats /api/) so the raised limit applies to backup
    # uploads only.
    location /api/buddy/ {
        proxy_pass http://naslos-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        # One chunk in flight at a time, so a slow link is a slow upload rather
        # than a failed backup.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # An interrupted push must not retry server-side: the sender resumes it
        # deliberately, chunk by chunk.
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}