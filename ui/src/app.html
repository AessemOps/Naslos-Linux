<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naslos</title>
    <link rel="icon" href="/favicon.png" />
    <script>
      // Pre-paint theme bootstrap: the palette is driven by data-theme on
      // <html>, so it must be set before first paint or a light preference
      // would flash the dark default. Stored choice wins; otherwise follow the
      // OS. ui/nginx.conf sets no CSP, so an inline script is safe here.
      (function () {
        try {
          var stored = localStorage.getItem('naslos:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="min-h-screen">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
