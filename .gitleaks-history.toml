# gitleaks configuration for `gitleaks git` (history scan).
#
# Unlike .gitleaks.toml it must NOT allowlist bootstrap/vm/ or the whole .kilo/
# tree: those are ignored working-tree material, but a copy that ever reached
# history is exactly what this scan exists to find (PF-H1: the Talos CA and an
# OpenLDAP password had to be purged with git filter-repo). Only two exact
# false-positive paths are exempted below.
[extend]
useDefault = true

# Intentional public test fixtures and one historical plan whose prose trips the
# generic-api-key heuristic ("privileged/RBAC"). Neither contains a credential:
# the nthash is the published hash of "password".
[[allowlists]]
description = "test fixtures and false positives"
paths = [
  '''^ui/tests/totp\.spec\.ts$''',
  '''^api/internal/identity/nthash_test\.go$''',
  '''^\.kilo/plans/1789420724996-security-audit\.md$''',
]
