# NSS configuration for the Naslos Samba container.
#
# `extrausers` reads /var/lib/extrausers/{passwd,group,shadow}, which is mounted
# from the node and rendered by the API from OpenLDAP. This is what lets Samba
# resolve LDAP users to UNIX uids without any local account existing in the
# container (which is replaced on every image update anyway).
passwd:     files extrausers
group:      files extrausers
shadow:     files extrausers
hosts:      files dns
networks:   files
protocols:  files
services:   files
ethers:     files
rpc:        files
netgroup:   files
