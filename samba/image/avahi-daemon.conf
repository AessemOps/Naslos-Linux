# Avahi (mDNS) configuration for the Naslos Samba container.
#
# The host name is rewritten at container start from SMB_DISCOVERY_NAME, so the
# name clients see while browsing the network matches the Samba NetBIOS name
# rendered in smb.conf by the API.
[server]
host-name=naslos
domain-name=local
use-ipv4=yes
use-ipv6=no
# The container runs with hostNetwork and shares port 5353 with whatever else
# is on the node, so a second stack must not be treated as fatal.
disallow-other-stacks=no
allow-interfaces=
deny-interfaces=
check-response-ttl=no
use-iff-running=no

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes

[reflector]
enable-reflector=no

[rlimits]
